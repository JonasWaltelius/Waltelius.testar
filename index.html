<html lang="sv">

                    </svg>
                </div>
                <div>
                    <h1 class="font-extrabold text-slate-900 text-lg leading-tight tracking-tight">

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8" id="app"></main>

    <!-- MODAL FÖR FLIKBYTE / VARNING -->

            </div>

            <p class="text-sm text-slate-600 mb-6" id="warningMessage">
                Du lämnade provfönstret. Detta registreras i systemet.
            </p>
            <button onclick="closeWarningModal()" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-xl shadow-md transition">
                Jag förstår, återgå

        </div>
    </div>

    <!-- SVÄVANDE POPUP FÖR ELEVSVAR & RESPONS -->

                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="studentDetailContent"></div>
        </div>
    </div>

    <!-- HELSKÄRMSLÄGE: VISA PÅ SKÄRM (PROJEKTOR / KLASSRUMSSTYRNING) -->
    <div id="projectorModal" class="fixed inset-0 bg-slate-900 z-50 flex flex-col p-6 sm:p-8 text-white hidden overflow-y-auto">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div>
                <span class="px-3 py-1 bg-red-600/30 text-red-400 font-bold uppercase tracking-widest text-xs rounded-full border border-red-500/30">
                    Aktiv Uppgift & Projektorläge
                </span>
                <h2 id="projTitle" class="text-2xl sm:text-4xl font-black tracking-tight mt-1"></h2>
                <p id="projSub" class="text-slate-400 text-sm sm:text-base font-medium"></p>
            </div>
            <div class="flex items-center space-x-6">
                <div class="text-right">
                    <div class="text-[10px] uppercase font-bold text-slate-400 tracking-widest">Provkod</div>
                    <div id="projCode" class="text-3xl sm:text-5xl font-mono font-black text-red-500 tracking-widest"></div>
                </div>
                <button onclick="closeProjectorModal()" class="text-slate-400 hover:text-white text-3xl pl-4">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- REALTIDSSTATUS PÅ SKÄRM -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
            <div class="bg-slate-800/60 rounded-2xl p-5 border border-slate-700/60">

                <div id="listOngoing" class="space-y-2.5 max-h-[55vh] overflow-y-auto pr-2"></div>
            </div>

            <div class="bg-slate-800/60 rounded-2xl p-5 border border-slate-700/60">
                <h3 class="text-lg font-bold text-emerald-400 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-circle-check"></i> Inlämnade (<span id="countSubmitted">0</span>)
                </h3>
                <div id="listSubmitted" class="space-y-2.5 max-h-[55vh] overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

<script>
const SUPABASE_URL = 'https://omjeuavtqdrktxohmebm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tamV1YXZ0cWRya3R4b2htZWJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNjkwMDAsImV4cCI6MjA1Njg0NTAwMH0.1_R5aR_u8-zN6lX_3-90d-_0';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const BANNED_WORDS = ['fan', 'jävel', 'helvete', 'skit', 'kukk', 'fitta', 'hor', 'bajs', 'snopp', 'fart', 'idiot', 'knulla', 'hitler', 'stalin', 'bitch'];
let localExamsFallback = JSON.parse(localStorage.getItem('waltelius_local_exams') || '[]');

const state = {
    view: 'welcome',
    currentUser: null,
    selectedExamId: null,
    activeExam: null,
    answers: {},
    cachedExams: [],
    editingExam: null,
    showArchive: false,
    examTimer: null,
    examSeconds: 0,
    warningCount: 0,
    revealedCodes: {},
    projectorInterval: null,
    lastSubmittedData: null
};

function switchView(targetView) {
    stopTimer();
    stopProjectorSync();
    state.view = targetView;
    render();
}

function goHome() {
    stopTimer();
    stopProjectorSync();
    state.view = 'welcome';
    render();
}

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function validateStudentName(name) {
    const trimmed = name.trim();
    const parts = trimmed.split(/\s+/);
    if (parts.length < 2 || parts[0].length < 2 || parts[1].length < 2) {
        return { valid: false, msg: "Vänligen ange både ditt riktiga för- och efternamn." };
    }
    const lower = trimmed.toLowerCase();
    for (let word of BANNED_WORDS) {
        if (lower.includes(word)) {
            return { valid: false, msg: "Vänligen ange ditt riktiga namn." };
        }
    }
    return { valid: true };
}

async function getExams() {
    let exams = [];
    if (db) {
        try {
            const { data, error } = await db.from('exams').select('*');
            if (!error && data && data.length > 0) exams = data;
        } catch (e) {}
    }
    if (exams.length === 0) exams = localExamsFallback;

    exams.sort((a, b) => {
        const tA = parseInt((a.id || '').replace('ex-', '')) || 0;
        const tB = parseInt((b.id || '').replace('ex-', '')) || 0;
        return tB - tA;
    });
    
    state.cachedExams = exams;
    return exams;
}

async function saveExamToDB(exam) {
    if (!exam.submissions) exam.submissions = [];
    if (!exam.activeStudents) exam.activeStudents = [];
    
    const localIdx = localExamsFallback.findIndex(e => e.id === exam.id);
    if (localIdx !== -1) localExamsFallback[localIdx] = exam;
    else localExamsFallback.unshift(exam);
    localStorage.setItem('waltelius_local_exams', JSON.stringify(localExamsFallback));

    const cacheIdx = state.cachedExams.findIndex(e => e.id === exam.id);
    if (cacheIdx !== -1) state.cachedExams[cacheIdx] = exam;
    else state.cachedExams.unshift(exam);

    if (!db) return true;
    try {
        await db.from('exams').upsert(exam);
        return true;
    } catch (e) {
        return true;
    }
}

async function deleteExamFromDB(examId) {
    localExamsFallback = localExamsFallback.filter(e => e.id !== examId);
    localStorage.setItem('waltelius_local_exams', JSON.stringify(localExamsFallback));
    state.cachedExams = state.cachedExams.filter(e => e.id !== examId);

    if (db) {
        try {
            await db.from('exams').delete().eq('id', examId);
        } catch (e) {}
    }
}

function startTimer() {
    stopTimer();
    state.examTimer = setInterval(() => {
        state.examSeconds++;
        const el = document.getElementById('digitalClock');
        if (el) {
            const mins = Math.floor(state.examSeconds / 60);
            el.innerText = `${mins} min`;
        }
    }, 1000);
}

function stopTimer() {
    if (state.examTimer) {
        clearInterval(state.examTimer);
        state.examTimer = null;
    }
}

function setupCheatDetection() {
    document.onvisibilitychange = async () => {
        if (document.hidden && state.view === 'student_exam') {
            await triggerCheatWarning();
        }
    };
}

async function triggerCheatWarning() {
    state.warningCount++;
    stopTimer();

    // Registrera varning i aktiva listan för projektorvisning
    if (state.activeExam && state.currentUser) {
        const student = (state.activeExam.activeStudents || []).find(s => s.name === state.currentUser.name);
        if (student) {
            student.warnings = state.warningCount;
            if (state.warningCount >= 2) student.locked = true;
            await saveExamToDB(state.activeExam);
        }
    }

    const modal = document.getElementById('cheatWarningModal');
    if (!modal) return;

    if (state.warningCount === 1) {
        document.getElementById('warningTitle').innerText = "Gult Kort: Du lämnade sidan!";
        document.getElementById('warningMessage').innerText = "Du har lämnat provfönstret 1 gång. Om du lämnar sidan igen låses ditt prov.";
        modal.classList.remove('hidden');
    } else if (state.warningCount >= 2) {
        document.getElementById('warningTitle').innerText = "Rött Kort: Provet låst!";
        document.getElementById('warningMessage').innerText = "Ditt prov har låsts eftersom du lämnat sidan upprepade gånger.";
        modal.classList.remove('hidden');
    }
}

function closeWarningModal() {
    const modal = document.getElementById('cheatWarningModal');
    if (modal) modal.classList.add('hidden');

    if (state.warningCount >= 2) {
        goHome();
    } else {
        startTimer();
    }
}

async function render() {
    const app = document.getElementById('app');
    const navRight = document.getElementById('navRight');
    if (!app) return;

    if (navRight) {
        if (state.view.startsWith('admin')) {
            navRight.innerHTML = `<button onclick="switchView('welcome')" class="text-sm font-semibold text-slate-600 hover:text-red-600">Lämna Testpanelen</button>`;
        } else {
            navRight.innerHTML = `<button onclick="switchView('admin')" class="text-sm font-semibold text-slate-600 hover:text-red-600">Testpanelen</button>`;
        }
    }

    const exams = await getExams();

    if (state.view === 'admin') {
        renderAdmin(app, exams);
    } else if (state.view === 'admin_board') {
        renderAdminBoard(app, exams);
    } else if (state.view === 'admin_edit') {
        renderAdminEdit(app);
    } else if (state.view === 'student_code') {
        renderStudentCode(app);
    } else if (state.view === 'student_exam') {
        renderStudentExam(app);
    } else if (state.view === 'student_result') {
        renderStudentResult(app);
    } else {
        renderWelcome(app, exams);
    }
}

function renderWelcome(container, exams) {
    const savedName = localStorage.getItem('waltelius_student_name') || '';
    const activeExams = exams.filter(e => (e.active === true || e.active === 'true') && e.archived !== true);
    const allClasses = [...new Set(exams.map(e => e.klass))];
    const displayClasses = allClasses.length > 0 ? allClasses : ['7H', '8H', '9H'];

    container.innerHTML = `
        <div class="max-w-xl mx-auto mt-6 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8">
            <div class="text-center mb-8">
                <span class="inline-block px-3 py-1 bg-red-100 text-red-700 text-xs font-bold rounded-full uppercase tracking-wider mb-2">Elevportal</span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Välkommen till Waltelius<span class="text-red-600">.testar</span></h2>
                <p class="text-sm text-slate-600 mt-2">Fyll i namn och välj din klass för att hitta din uppgift.</p>
            </div>

            <form onsubmit="handleWelcomeSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Ditt För- och Efternamn</label>
                    <input type="text" id="studentName" required value="${savedName}" placeholder="t.ex. Anna Svensson" 
                        autocomplete="off" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Klass</label>
                    <select id="studentClass" required onchange="updateExamDropdown()" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 bg-white">
                        <option value="">-- Välj din klass --</option>
                        ${displayClasses.map(c => `<option value="${c}">${c}</option>`).join('')}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Välj Material / Uppgift</label>
                    <select id="studentExamSelect" required disabled class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 bg-white disabled:bg-slate-100">
                        <option value="">-- Välj klass först --</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-lg transition">
                    Gå vidare till kod →
                </button>
            </form>
        </div>
    `;
}

function updateExamDropdown() {
    const klass = document.getElementById('studentClass').value;
    const select = document.getElementById('studentExamSelect');
    const exams = state.cachedExams.filter(e => e.klass === klass && (e.active === true || e.active === 'true') && e.archived !== true);

    if (!klass || exams.length === 0) {
        select.innerHTML = '<option value="">-- Inga aktiva uppgifter för ' + (klass || 'vald klass') + ' --</option>';
        select.disabled = true;
        return;
    }

    select.disabled = false;
    select.innerHTML = '<option value="">-- Välj uppgift --</option>' + 
        exams.map(e => `<option value="${e.id}">${e.title} (${e.type} - ${e.category})</option>`).join('');
}

function handleWelcomeSubmit(e) {
    e.preventDefault();
    const nameInput = document.getElementById('studentName').value;
    const validation = validateStudentName(nameInput);
    if (!validation.valid) {
        alert(validation.msg);
        return;
    }

    const name = nameInput.trim();
    localStorage.setItem('waltelius_student_name', name);

    const klass = document.getElementById('studentClass').value;
    const examId = document.getElementById('studentExamSelect').value;

    const originalExam = state.cachedExams.find(ex => ex.id === examId);

    // Om det är Entry/Exit ticket, slumpa ordningen på begrepp och förklaringar
    let preparedQuestions = (originalExam.questions || []);
    if (['Entryticket', 'Exitticket'].includes(originalExam.type)) {
        preparedQuestions = shuffleArray(preparedQuestions);
    }

    state.currentUser = { name, class: klass };
    state.activeExam = { ...originalExam, questions: preparedQuestions };
    switchView('student_code');
}

function renderStudentCode(container) {
    container.innerHTML = `
        <div class="max-w-md mx-auto mt-12 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 text-center">
            <div class="w-14 h-14 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-1">Ange Provkod</h2>
            <p class="text-xs text-slate-500 mb-6">Slå in koden för "${state.activeExam ? state.activeExam.title : ''}"</p>

            <form onsubmit="handleCodeSubmit(event)" class="space-y-4">
                <input type="text" id="inputCode" maxlength="4" required placeholder="0 0 0 0"
                    class="w-full text-center text-3xl font-mono tracking-widest py-3 border-2 border-slate-300 rounded-xl focus:border-red-600 outline-none uppercase">
                
                <div id="codeError" class="text-red-500 text-xs font-semibold hidden">Felaktig kod. Försök igen.</div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="switchView('welcome')" class="w-1/2 py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl">Tillbaka</button>
                    <button type="submit" class="w-1/2 py-3 bg-red-600 text-white font-semibold rounded-xl shadow-md">Starta uppgiften</button>
                </div>
            </form>
        </div>
    `;
}

async function handleCodeSubmit(e) {
    e.preventDefault();
    const code = document.getElementById('inputCode').value.trim();
    if (code === state.activeExam.code) {
        state.answers = {};
        state.examSeconds = 0;
        state.warningCount = 0;

        // Registrera eleven i aktiva listan för projektorvisning
        if (!state.activeExam.activeStudents) state.activeExam.activeStudents = [];
        const existingIdx = state.activeExam.activeStudents.findIndex(s => s.name === state.currentUser.name);
        if (existingIdx !== -1) {
            state.activeExam.activeStudents[existingIdx].locked = false;
        } else {
            state.activeExam.activeStudents.push({
                name: state.currentUser.name,
                class: state.currentUser.class,
                joinedAt: new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }),
                warnings: 0,
                locked: false
            });
        }
        await saveExamToDB(state.activeExam);

        state.view = 'student_exam';
        setupCheatDetection();
        startTimer();
        render();
    } else {
        document.getElementById('codeError').classList.remove('hidden');
    }
}

function renderStudentExam(container) {
    const exam = state.activeExam || {};
    const questions = exam.questions || [];
    const initialMins = Math.floor(state.examSeconds / 60);
    const isTicket = ['Entryticket', 'Exitticket'].includes(exam.type);

    container.innerHTML = `
        <div class="max-w-2xl mx-auto space-y-6">
            <div class="bg-gradient-to-r from-red-600 to-red-800 text-white p-6 rounded-2xl shadow-md flex items-center justify-between">
                <div>
                    <span class="text-xs uppercase font-semibold opacity-80">${exam.type} • ${exam.category}</span>
                    <h2 class="text-2xl font-bold">${exam.title}</h2>
                    <p class="text-xs opacity-90 mt-1">Elev: ${state.currentUser.name} (${state.currentUser.class})</p>
                </div>
                <div class="bg-white/10 px-4 py-2 rounded-xl backdrop-blur-sm flex items-center gap-2 border border-white/20">
                    <i class="fa-regular fa-clock text-red-200"></i>
                    <span id="digitalClock" class="font-mono font-bold text-sm text-white">${initialMins} min</span>
                </div>
            </div>

            <form onsubmit="handleExamSubmit(event)" class="space-y-6">
                ${questions.length === 0 ? '<div class="bg-white p-6 rounded-2xl border text-center text-slate-400">Denna uppgift saknar frågor än så länge.</div>' : ''}
                ${questions.map((q, idx) => `
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <div class="text-xs font-bold text-red-600">${isTicket ? 'Begrepp ' + (idx + 1) : 'Fråga ' + (idx + 1)}</div>
                        <h3 class="text-base font-bold text-slate-900">${q.text || 'Begrepp/Fråga'}</h3>
                        ${isTicket && q.explanation ? `<div class="text-xs bg-slate-100 p-2.5 rounded-lg text-slate-600"><strong>Förklaring/Kontext:</strong> ${q.explanation}</div>` : ''}
                        <textarea required onchange="state.answers['q_${idx}'] = this.value" rows="3" 
                            placeholder="${isTicket ? 'Skriv förklaring/resonemang kring begreppet...' : 'Skriv ditt svar här...'}" class="w-full p-3.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                `).join('')}

                <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition">
                    Lämna in svar
                </button>
            </form>
        </div>
    `;
}

async function handleExamSubmit(e) {
    e.preventDefault();
    stopTimer();
    const exam = state.activeExam;

    // Ta bort från pågående listan
    if (exam.activeStudents) {
        exam.activeStudents = exam.activeStudents.filter(s => s.name !== state.currentUser.name);
    }

    // Automatisk utvärdering, plupp & formativ feedback direkt till elev
    let totalLength = 0;
    let filledCount = 0;
    (exam.questions || []).forEach((q, idx) => {
        const val = (state.answers['q_' + idx] || '').trim();
        if (val.length > 0) filledCount++;
        totalLength += val.length;
    });

    const totalQuestions = (exam.questions || []).length;
    let autoPlupp = 'lightgreen';
    let autoFeedback = '';

    if (filledCount < totalQuestions || totalLength < 15) {
        autoPlupp = 'red';
        autoFeedback = `🔴 **Status: Komplettering krävs**\n\nDu har lämnat några frågor obesvarade eller med väldigt korta svar. För att bli godkänd behöver du förklara och utveckla dina resonemang lite mer noggrant nästa gång.`;
    } else if (totalLength > 120 && filledCount === totalQuestions) {
        autoPlupp = 'darkgreen';
        autoFeedback = `🟢 **Status: Mörkgrön (Utmärkt)**\n\nMycket väl genomfört! Du förklarar med egna ord, har fyllt i alla delar och visar en djup förståelse för begreppen/ämnet.`;
    } else {
        autoPlupp = 'lightgreen';
        autoFeedback = `🟢 **Status: Ljusgrön (Godkänd)**\n\nBra jobbat! Du har besvarat alla frågor och visat att du behärskar grunderna. För att nå ännu högre kan du försöka ge fler konkreta exempel nästa gång.`;
    }

    const submission = {
        id: 'sub-' + Date.now(),
        studentName: state.currentUser.name,
        studentClass: state.currentUser.class,
        submittedAt: new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }),
        status: 'Inlämnat',
        secondsSpent: state.examSeconds,
        warnings: state.warningCount,
        gradeStatus: autoPlupp,
        aiFeedback: autoFeedback,
        answers: state.answers
    };

    if (!exam.submissions) exam.submissions = [];
    exam.submissions.push(submission);

    await saveExamToDB(exam);
    state.lastSubmittedData = submission;
    switchView('student_result');
}

async function updateProjectorLists() {
    const exams = await getExams();
    const exam = exams.find(e => e.id === state.selectedExamId);
    if (!exam) return;

    const ongoing = exam.activeStudents || [];
    const submitted = exam.submissions || [];

    document.getElementById('countOngoing').innerText = ongoing.length;
    document.getElementById('countSubmitted').innerText = submitted.length;

    const listOngoing = document.getElementById('listOngoing');
    listOngoing.innerHTML = ongoing.length === 0 ? '<div class="text-xs text-slate-500 py-2">Inga elever pågår för stunden.</div>' :
        ongoing.map(s => `
            <div class="flex items-center justify-between p-3 rounded-xl bg-slate-800 border border-slate-700/80 text-sm">
                <div class="flex items-center space-x-2">
                    <span class="font-bold text-slate-200">${s.name}</span>
                    ${s.warnings === 1 ? '<span class="px-2 py-0.5 bg-amber-500/20 text-amber-400 text-xs font-bold rounded-full border border-amber-500/40"><i class="fa-solid fa-triangle-exclamation"></i> Gult kort</span>' : ''}
                    ${s.locked ? '<span class="px-2 py-0.5 bg-red-500/20 text-red-400 text-xs font-bold rounded-full border border-red-500/40"><i class="fa-solid fa-lock"></i> Rött kort</span>' : ''}
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-xs font-mono text-slate-400">${s.joinedAt || ''}</span>
                    ${s.locked ? `
                        <button onclick="adminResumeStudent('${s.name}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg shadow-sm">
                            Återuppta
                        </button>
                    ` : ''}
                </div>
            </div>
        `).join('');

    const listSubmitted = document.getElementById('listSubmitted');
    listSubmitted.innerHTML = submitted.length === 0 ? '<div class="text-xs text-slate-500 py-2">Inga elever har lämnat in ännu.</div>' :
        submitted.map(s => {
            const mins = Math.floor((s.secondsSpent || 0) / 60);
            return `
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-800 border border-slate-700/80 text-sm">
                    <span class="font-bold text-slate-200">${s.studentName}</span>
                    <div class="flex items-center space-x-2">

                    </div>
                </div>
            `;
        }).join('');
}

async function adminResumeStudent(studentName) {
    const exam = state.cachedExams.find(e => e.id === state.selectedExamId);
    if (!exam || !exam.activeStudents) return;
    const student = exam.activeStudents.find(s => s.name === studentName);
    if (student) {
        student.locked = false;
        student.warnings = 0;
        await saveExamToDB(exam);
        updateProjectorLists();
    }
}

    if (!exam || !exam.submissions) return;
    const sub = exam.submissions.find(s => s.id === subId);
    if (sub) {
        const order = ['lightgreen', 'darkgreen', 'red'];
        const currentIdx = order.indexOf(sub.gradeStatus || 'lightgreen');
        sub.gradeStatus = order[(currentIdx + 1) % order.length];
        await saveExamToDB(exam);
        render();
    }
}

                        <select id="editKlassSelect" onchange="toggleCustomKlassInput(this.value)" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                            <option value="7H" ${exam.klass === '7H' ? 'selected' : ''}>7H</option>
                            <option value="8H" ${exam.klass === '8H' ? 'selected' : ''}>8H</option>
                            <option value="9H" ${exam.klass === '9H' ? 'selected' : ''}>9H</option>
                            <option value="custom" ${isCustomClass ? 'selected' : ''}>Egen klass...</option>
                        </select>
                        <input type="text" id="editKlassCustom" value="${isCustomClass ? exam.klass : ''}" placeholder="Skriv klass" 
                            class="${isCustomClass ? '' : 'hidden'} mt-2 w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                    </div>

                    <div class="sm:col-span-4">
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Provkod</label>
                        <div class="flex items-center space-x-1">
                            <input type="text" id="editCode" maxlength="4" required value="${exam.code || ''}"
                                class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm font-mono text-center">
                            <button type="button" onclick="refreshCode()" title="Slumpa ny kod" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl border border-slate-300 text-xs">
                                <i class="fa-solid fa-arrows-rotate"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-200 pt-5 space-y-4">
                    <h3 class="font-bold text-slate-900">${isTicket ? 'Begrepp & Förklaringar' : 'Frågor & Bedömningskriterier'}</h3>
                    <div class="space-y-4">
                        ${(exam.questions || []).map((q, idx) => renderEditQuestionCard(q, idx, (exam.questions || []).length, isTicket)).join('')}
                    </div>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                    <div class="space-x-2">
                        <button type="button" onclick="addTextQuestion()" class="px-3 py-2 bg-red-50 text-red-700 font-bold text-xs rounded-xl">${isTicket ? '+ Nytt Begrepp' : '+ Ny fråga'}</button>
                    </div>
                    <button type="submit" class="px-6 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs shadow-md">
                        Spara Uppgift
                    </button>
                </div>
            </form>
        </div>
    `;
}

function refreshCode() {
    const newCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('editCode').value = newCode;
    if (state.editingExam) state.editingExam.code = newCode;
}

function toggleCustomKlassInput(val) {
    const input = document.getElementById('editKlassCustom');
    if (val === 'custom') {
        input.classList.remove('hidden');
        input.required = true;
    } else {
        input.classList.add('hidden');
        input.required = false;
    }
}

function renderEditQuestionCard(q, idx, totalQuestions, isTicket) {
    if (isTicket) {
        return `
            <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-xs text-red-600">Begrepp ${idx + 1}</span>
                    <div class="flex items-center space-x-1">
                        ${idx > 0 ? `<button type="button" onclick="moveQuestion(${idx}, -1)" title="Flytta upp" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▲</button>` : ''}
                        ${idx < totalQuestions - 1 ? `<button type="button" onclick="moveQuestion(${idx}, 1)" title="Flytta ner" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▼</button>` : ''}
                        <button type="button" onclick="removeQuestion(${idx})" class="text-red-500 text-xs ml-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
                <input type="text" value="${q.text || ''}" onchange="state.editingExam.questions[${idx}].text = this.value" placeholder="Begrepp (t.ex. Urbanisering)..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                <input type="text" value="${q.explanation || ''}" onchange="state.editingExam.questions[${idx}].explanation = this.value" placeholder="Förklaring/Svar för begreppet..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                <input type="text" value="${q.criteria || ''}" onchange="state.editingExam.questions[${idx}].criteria = this.value" placeholder="Bedömningskriterier / Krav för nivåer E, C, A (valfritt)..." class="w-full px-3 py-1.5 rounded-lg border border-slate-200 text-xs bg-white text-slate-600">
            </div>
        `;
    }

    return `
        <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-3">
            <div class="flex items-center justify-between">
                <span class="font-bold text-xs text-red-600">Fråga ${idx + 1}</span>
                <div class="flex items-center space-x-1">
                    ${idx > 0 ? `<button type="button" onclick="moveQuestion(${idx}, -1)" title="Flytta upp" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▲</button>` : ''}
                    ${idx < totalQuestions - 1 ? `<button type="button" onclick="moveQuestion(${idx}, 1)" title="Flytta ner" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▼</button>` : ''}
                    <button type="button" onclick="removeQuestion(${idx})" class="text-red-500 text-xs ml-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <input type="text" value="${q.text || ''}" onchange="state.editingExam.questions[${idx}].text = this.value" placeholder="Skriv frågan..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
            <input type="text" value="${q.criteria || ''}" onchange="state.editingExam.questions[${idx}].criteria = this.value" placeholder="Bedömningskriterier / Krav för nivåer E, C, A (valfritt)..." class="w-full px-3 py-1.5 rounded-lg border border-slate-200 text-xs bg-white text-slate-600">
        </div>
    `;
}

function moveQuestion(idx, direction) {
    syncFormToState();
    const questions = state.editingExam.questions;
    const targetIdx = idx + direction;
    if (targetIdx >= 0 && targetIdx < questions.length) {
        const temp = questions[idx];
        questions[idx] = questions[targetIdx];
        questions[targetIdx] = temp;
        render();
    }
}

function addTextQuestion() {
    syncFormToState();
    if (!state.editingExam.questions) state.editingExam.questions = [];
    state.editingExam.questions.push({ id: Date.now(), type: 'text', text: '', explanation: '', criteria: '' });
    render();
}

function removeQuestion(idx) {
    syncFormToState();
    state.editingExam.questions.splice(idx, 1);
    render();
}

async function saveEditedExam(e) {
    e.preventDefault();
    syncFormToState();
    const exam = state.editingExam;
    exam.active = true;
    await saveExamToDB(exam);
    switchView('admin');
}

document.addEventListener('DOMContentLoaded', render);
render();
</script>
</body>
</html>
