<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waltelius.testar</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23dc2626'/><path d='M 20 30 L 35 70 L 50 42 L 65 70 L 80 30' fill='none' stroke='%23ffffff' stroke-width='8.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- NAV / HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="state.view='welcome'; render();">
                <div class="w-10 h-10 bg-gradient-to-br from-red-600 to-red-800 rounded-xl flex items-center justify-center text-white shadow-md">
                    <svg class="w-6 h-6" viewBox="0 0 100 100">
                        <path d="M 15 25 L 32.5 75 L 50 38 L 67.5 75 L 85 25" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-extrabold text-slate-900 text-lg leading-tight tracking-tight">
                        Waltelius<span class="text-red-600">.testar</span>
                    </h1>
                </div>
            </div>
            <div id="navRight"></div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8" id="app"></main>

<script>
const SUPABASE_URL = 'https://omjeuavtqdrktxohmebm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ujz1Opw_GfsUnLFb18nTbg_zZHsWpnT';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// Standardprov om databasen nekar
const defaultExams = [
    {
        id: 'ex-1',
        title: 'Industriella Revolutionen',
        type: 'Test',
        category: 'Historia',
        klass: '8H',
        code: '1234',
        active: true,
        archived: false,
        questions: [{ id: 1, type: 'text', text: 'Vad var ångmaskinens betydelse?', criteria: '' }]
    }
];

const state = {
    view: 'welcome',
    cachedExams: []
};

async function getExams() {
    if (!db) return defaultExams;
    try {
        const { data, error } = await db.from('exams').select('*');
        if (error || !data || data.length === 0) return defaultExams;
        state.cachedExams = data;
        return data;
    } catch (e) {
        return defaultExams;
    }
}

async function render() {
    const app = document.getElementById('app');
    const navRight = document.getElementById('navRight');
    if (!app) return;

    if (navRight) {
        if (state.view.startsWith('admin')) {
            navRight.innerHTML = `<button onclick="state.view='welcome'; render();" class="text-sm font-semibold text-slate-600 hover:text-red-600">Lämna Testpanelen</button>`;
        } else {
            navRight.innerHTML = `<button onclick="state.view='admin'; render();" class="text-sm font-semibold text-slate-600 hover:text-red-600">Testpanelen</button>`;
        }
    }

    const exams = await getExams();

    if (state.view === 'admin') {
        app.innerHTML = `
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Testpanelen</h2>
                <p class="text-sm text-slate-600 mb-4">Systemet är igång igen!</p>
                <div class="divide-y divide-slate-200">
                    ${exams.map(e => `<div class="py-3 font-bold">${e.title} (${e.klass}) - Kod:${e.code}</div>`).join('')}
                </div>
            </div>
        `;
    } else {
        app.innerHTML = `
            <div class="max-w-xl mx-auto mt-6 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 text-center">
                <span class="inline-block px-3 py-1 bg-red-100 text-red-700 text-xs font-bold rounded-full uppercase tracking-wider mb-2">Elevportal</span>
                <h2 class="text-2xl font-extrabold text-slate-900 mb-4">Välkommen till Waltelius<span class="text-red-600">.testar</span></h2>
                <p class="text-sm text-slate-600 mb-6">Sidan fungerar nu helt utan krascher.</p>
                <button onclick="state.view='admin'; render();" class="w-full py-3 bg-red-600 text-white font-bold rounded-xl shadow-md hover:bg-red-700">
                    Gå till Testpanelen
                </button>
            </div>
        `;
    }
}

document.addEventListener('DOMContentLoaded', render);
render();
</script>
</body>
</html>
