<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waltelius.testar</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23dc2626'/><path d='M 20 30 L 35 70 L 50 42 L 65 70 L 80 30' fill='none' stroke='%23ffffff' stroke-width='8.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- NAV / HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('welcome')">
                <div class="w-10 h-10 bg-gradient-to-br from-red-600 to-red-800 rounded-xl flex items-center justify-center text-white shadow-md">
                    <svg class="w-6 h-6" viewBox="0 0 100 100">
                        <path d="M 15 25 L 32.5 75 L 50 38 L 67.5 75 L 85 25" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-extrabold text-slate-900 text-lg leading-tight tracking-tight">
                        Waltelius<span class="text-red-600">.testar</span>
                    </h1>
                </div>
            </div>
            <div id="navRight"></div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8" id="app"></main>

<script>
const SUPABASE_URL = 'https://omjeuavtqdrktxohmebm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tamV1YXZ0cWRya3R4b2htZWJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNjkwMDAsImV4cCI6MjA1Njg0NTAwMH0.1_R5aR_u8-zN6lX_3-90d-_0';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

let localExamsFallback = JSON.parse(localStorage.getItem('waltelius_local_exams') || '[]');

const state = {
    view: 'welcome',
    cachedExams: [],
    editingExam: null,
    showArchive: false
};

function switchView(targetView) {
    state.view = targetView;
    render();
}

async function getExams() {
    if (!db) return localExamsFallback;
    try {
        const { data, error } = await db.from('exams').select('*');
        if (error || !data || data.length === 0) return localExamsFallback;
        data.sort((a, b) => {
            const tA = parseInt((a.id || '').replace('ex-', '')) || 0;
            const tB = parseInt((b.id || '').replace('ex-', '')) || 0;
            return tB - tA;
        });
        state.cachedExams = data;
        return data;
    } catch (e) {
        return localExamsFallback;
    }
}

async function saveExamToDB(exam) {
    if (!exam.submissions) exam.submissions = [];
    const localIdx = localExamsFallback.findIndex(e => e.id === exam.id);
    if (localIdx !== -1) localExamsFallback[localIdx] = exam;
    else localExamsFallback.unshift(exam);
    localStorage.setItem('waltelius_local_exams', JSON.stringify(localExamsFallback));

    if (!db) return true;
    try {
        await db.from('exams').upsert(exam);
        return true;
    } catch (e) {
        return true;
    }
}

async function render() {
    const app = document.getElementById('app');
    const navRight = document.getElementById('navRight');
    if (!app) return;

    if (navRight) {
        if (state.view.startsWith('admin')) {
            navRight.innerHTML = `<button onclick="switchView('welcome')" class="text-sm font-semibold text-slate-600 hover:text-red-600">Lämna Testpanelen</button>`;
        } else {
            navRight.innerHTML = `<button onclick="switchView('admin')" class="text-sm font-semibold text-slate-600 hover:text-red-600">Testpanelen</button>`;
        }
    }

    const exams = await getExams();

    if (state.view === 'admin') {
        renderAdmin(app, exams);
    } else if (state.view === 'admin_edit') {
        renderAdminEdit(app);
    } else {
        renderWelcome(app, exams);
    }
}

function renderWelcome(container, exams) {
    container.innerHTML = `
        <div class="max-w-xl mx-auto mt-6 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 text-center">
            <span class="inline-block px-3 py-1 bg-red-100 text-red-700 text-xs font-bold rounded-full uppercase tracking-wider mb-2">Elevportal</span>
            <h2 class="text-2xl font-extrabold text-slate-900 mb-4">Välkommen till Waltelius<span class="text-red-600">.testar</span></h2>
            <p class="text-sm text-slate-600 mb-6">Systemet är återställt och redo.</p>
            <button onclick="switchView('admin')" class="w-full py-3 bg-red-600 text-white font-bold rounded-xl shadow-md hover:bg-red-700">
                Gå till Testpanelen
            </button>
        </div>
    `;
}

function renderAdmin(container, exams) {
    const isArchive = state.showArchive;
    const filteredExams = exams.filter(e => isArchive ? e.archived : !e.archived);

    container.innerHTML = `
        <div class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">${isArchive ? 'Arkiverade Uppgifter' : 'Testpanelen & Hantering'}</h2>
                    <p class="text-xs text-slate-500 mt-1">Klicka på "Aktivera" för att göra ett prov synligt för eleverna.</p>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="state.showArchive = !state.showArchive; render();" class="px-4 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">
                        <i class="fa-solid fa-box-archive mr-1"></i> ${isArchive ? 'Visa Aktiva' : 'Arkiv'}
                    </button>
                    ${!isArchive ? `
                        <button onclick="openCreateExamModal()" class="px-5 py-2.5 bg-red-600 text-white font-bold rounded-xl shadow-md text-xs">
                            + Skapa Ny Uppgift
                        </button>
                    ` : ''}
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-4 divide-y divide-slate-200">
                ${filteredExams.length === 0 ? `<div class="p-6 text-center text-slate-400">${isArchive ? 'Arkivet är tomt.' : 'Inga uppgifter. Skapa en ny ovan!'}</div>` : ''}
                ${filteredExams.map(e => `
                    <div class="py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                            <div class="font-bold text-slate-900">${e.title || 'Utan titel'}</div>
                            <div class="text-xs text-slate-500 mt-0.5">
                                ${e.type} • ${e.category} • Klass ${e.klass} • Kod: <span class="font-mono font-bold text-red-600">${e.code}</span> • 
                                <span class="font-semibold ${e.active ? 'text-emerald-600' : 'text-slate-400'}">${e.active ? 'Aktiv' : 'Inaktiv'}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="toggleActive('${e.id}')" class="px-3 py-1.5 text-xs font-bold rounded-lg border ${e.active ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-emerald-600 text-white shadow-sm'}">
                                ${e.active ? 'Inaktivera' : 'Aktivera nu!'}
                            </button>
                            <button onclick="openEditExam('${e.id}')" class="px-2.5 py-1.5 bg-slate-100 text-slate-700 font-semibold rounded-lg text-xs">
                                Redigera
                            </button>
                            <button onclick="toggleArchive('${e.id}')" class="px-2.5 py-1.5 bg-amber-50 text-amber-700 border border-amber-200 font-semibold rounded-lg text-xs">
                                ${e.archived ? 'Återställ' : 'Arkivera'}
                            </button>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

function openCreateExamModal() {
    state.editingExam = {
        id: 'ex-' + Date.now(),
        title: '',
        type: 'Test',
        category: 'Historia',
        klass: '7H',
        code: Math.floor(1000 + Math.random() * 9000).toString(),
        active: false,
        archived: false,
        questions: []
    };
    switchView('admin_edit');
}

function openEditExam(id) {
    const exam = state.cachedExams.find(e => e.id === id) || localExamsFallback.find(e => e.id === id);
    if (exam) {
        state.editingExam = JSON.parse(JSON.stringify(exam));
        switchView('admin_edit');
    }
}

async function toggleActive(id) {
    const exam = state.cachedExams.find(e => e.id === id) || localExamsFallback.find(e => e.id === id);
    if (exam) {
        exam.active = !exam.active;
        await saveExamToDB(exam);
        render();
    }
}

async function toggleArchive(id) {
    const exam = state.cachedExams.find(e => e.id === id) || localExamsFallback.find(e => e.id === id);
    if (exam) {
        exam.archived = !exam.archived;
        if (exam.archived) exam.active = false;
        await saveExamToDB(exam);
        render();
    }
}

function syncFormToState() {
    if (!state.editingExam) return;
    const titleEl = document.getElementById('editTitle');
    if (titleEl) state.editingExam.title = titleEl.value;

    const klassSel = document.getElementById('editKlassSelect');
    if (klassSel) {
        if (klassSel.value === 'custom') {
            state.editingExam.klass = document.getElementById('editKlassCustom').value.trim();
        } else {
            state.editingExam.klass = klassSel.value;
        }
    }

    const codeEl = document.getElementById('editCode');
    if (codeEl) state.editingExam.code = codeEl.value.trim();

    const catEl = document.getElementById('editCategory');
    if (catEl) state.editingExam.category = catEl.value;

    const typeEl = document.getElementById('editType');
    if (typeEl) state.editingExam.type = typeEl.value;
}

function renderAdminEdit(container) {
    const exam = state.editingExam || {};
    const isCustomClass = !['7H', '8H', '9H'].includes(exam.klass);

    container.innerHTML = `
        <div class="max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 space-y-6">
            <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                <h2 class="text-2xl font-bold text-slate-900">${exam.title ? 'Redigera uppgift' : 'Skapa Ny Uppgift'}</h2>
                <button onclick="switchView('admin')" class="text-sm font-semibold text-slate-500">Avbryt</button>
            </div>

            <form onsubmit="saveEditedExam(event)" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Typ av uppgift</label>
                        <select id="editType" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                            <option value="Test" ${exam.type === 'Test' ? 'selected' : ''}>Test</option>
                            <option value="Entryticket" ${exam.type === 'Entryticket' ? 'selected' : ''}>Entryticket</option>
                            <option value="Exitticket" ${exam.type === 'Exitticket' ? 'selected' : ''}>Exitticket</option>
                            <option value="Träning" ${exam.type === 'Träning' ? 'selected' : ''}>Träning/Repetition</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ämne</label>
                        <select id="editCategory" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                            <option value="Historia" ${exam.category === 'Historia' ? 'selected' : ''}>Historia</option>
                            <option value="Geografi" ${exam.category === 'Geografi' ? 'selected' : ''}>Geografi</option>
                            <option value="Religion" ${exam.category === 'Religion' ? 'selected' : ''}>Religion</option>
                            <option value="Samhällskunskap" ${exam.category === 'Samhällskunskap' ? 'selected' : ''}>Samhällskunskap</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-end">
                    <div class="sm:col-span-5">
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Titel på uppgift</label>
                        <input type="text" id="editTitle" required value="${exam.title || ''}" placeholder="t.ex. Industriella Revolutionen"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm">
                    </div>

                    <div class="sm:col-span-3">
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Klass</label>
                        <select id="editKlassSelect" onchange="toggleCustomKlassInput(this.value)" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                            <option value="7H" ${exam.klass === '7H' ? 'selected' : ''}>7H</option>
                            <option value="8H" ${exam.klass === '8H' ? 'selected' : ''}>8H</option>
                            <option value="9H" ${exam.klass === '9H' ? 'selected' : ''}>9H</option>
                            <option value="custom" ${isCustomClass ? 'selected' : ''}>Egen klass...</option>
                        </select>
                        <input type="text" id="editKlassCustom" value="${isCustomClass ? exam.klass : ''}" placeholder="Skriv klass" 
                            class="${isCustomClass ? '' : 'hidden'} mt-2 w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                    </div>

                    <div class="sm:col-span-4">
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Provkod</label>
                        <div class="flex items-center space-x-1">
                            <input type="text" id="editCode" maxlength="4" required value="${exam.code || ''}"
                                class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm font-mono text-center">
                            <button type="button" onclick="refreshCode()" title="Slumpa ny kod" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl border border-slate-300 text-xs">
                                <i class="fa-solid fa-arrows-rotate"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-200 pt-5 space-y-4">
                    <h3 class="font-bold text-slate-900">Frågor</h3>
                    <div class="space-y-4">
                        ${(exam.questions || []).map((q, idx) => renderEditQuestionCard(q, idx, (exam.questions || []).length)).join('')}
                    </div>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                    <div class="space-x-2">
                        <button type="button" onclick="addTextQuestion()" class="px-3 py-2 bg-red-50 text-red-700 font-bold text-xs rounded-xl">+ Öppen fråga</button>
                    </div>
                    <button type="submit" class="px-6 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs shadow-md">
                        Spara Uppgift
                    </button>
                </div>
            </form>
        </div>
    `;
}

function refreshCode() {
    const newCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('editCode').value = newCode;
    if (state.editingExam) state.editingExam.code = newCode;
}

function toggleCustomKlassInput(val) {
    const input = document.getElementById('editKlassCustom');
    if (val === 'custom') {
        input.classList.remove('hidden');
        input.required = true;
    } else {
        input.classList.add('hidden');
        input.required = false;
    }
}

function renderEditQuestionCard(q, idx, totalQuestions) {
    return `
        <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-3">
            <div class="flex items-center justify-between">
                <span class="font-bold text-xs text-red-600">Fråga ${idx + 1}</span>
                <button type="button" onclick="removeQuestion(${idx})" class="text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
            <input type="text" value="${q.text || ''}" onchange="state.editingExam.questions[${idx}].text = this.value" placeholder="Skriv frågan..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
        </div>
    `;
}

function addTextQuestion() {
    syncFormToState();
    if (!state.editingExam.questions) state.editingExam.questions = [];
    state.editingExam.questions.push({ id: Date.now(), type: 'text', text: '', criteria: '' });
    render();
}

function removeQuestion(idx) {
    syncFormToState();
    state.editingExam.questions.splice(idx, 1);
    render();
}

async function saveEditedExam(e) {
    e.preventDefault();
    syncFormToState();
    const exam = state.editingExam;
    await saveExamToDB(exam);
    switchView('admin');
}

document.addEventListener('DOMContentLoaded', render);
render();
</script>
</body>
</html>
