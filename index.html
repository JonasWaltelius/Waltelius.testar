<!DOCTYPE html>
<html lang="sv">
<head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased no-select" oncopy="return false" oncut="return false">

    <!-- NAV / HEADER -->

                <div class="w-10 h-10 bg-gradient-to-br from-red-600 to-red-800 rounded-xl flex items-center justify-center text-white shadow-md">
                    <svg class="w-6 h-6" viewBox="0 0 100 100">
                        <path d="M 15 25 L 32.5 75 L 50 38 L 67.5 75 L 85 25" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-extrabold text-slate-900 text-lg leading-tight tracking-tight">
                        Waltelius<span class="text-red-600">.testar</span>
                    </h1>
                </div>
            </div>
            <div id="navRight"></div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8" id="app"></main>

    <!-- MODAL FÖR FLIKBYTE / VARNING -->
    <div id="cheatWarningModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center border-2 border-amber-500">
            <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-600 text-3xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2" id="warningTitle">Varning: Du lämnade sidan!</h3>
            <p class="text-sm text-slate-600 mb-6" id="warningMessage">
                Du lämnade provfönstret. Detta registreras i systemet.
            </p>
            <button onclick="closeWarningModal()" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-xl shadow-md transition">
                Jag förstår, återgå
            </button>
        </div>
    </div>

    <!-- SVÄVANDE POPUP FÖR ELEVSVAR & AI-RESPONS -->
    <div id="studentDetailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden" onclick="closeStudentDetailModal()">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto p-6 sm:p-8 relative" onclick="event.stopPropagation()">
            <button onclick="closeStudentDetailModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="studentDetailContent"></div>
        </div>
    </div>

<script>
const SUPABASE_URL = 'https://omjeuavtqdrktxohmebm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tamV1YXZ0cWRya3R4b2htZWJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNjkwMDAsImV4cCI6MjA1Njg0NTAwMH0.1_R5aR_u8-zN6lX_3-90d-_0';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const BANNED_WORDS = ['fan', 'jävel', 'helvete', 'skit', 'kukk', 'fitta', 'hor', 'bajs', 'snopp', 'fart', 'idiot', 'knulla', 'hitler', 'stalin', 'bitch'];
let localExamsFallback = JSON.parse(localStorage.getItem('waltelius_local_exams') || '[]');

const state = {
    view: 'welcome',
    currentUser: null,
    selectedExamId: null,
    activeExam: null,
    answers: {},
    cachedExams: [],
    editingExam: null,
    showArchive: false,
    examTimer: null,
    examSeconds: 0,
    warningCount: 0
};

function switchView(targetView) {
    stopTimer();
    state.view = targetView;
    render();
}

function goHome() {
    stopTimer();
    state.view = 'welcome';
    render();
}

function validateStudentName(name) {
    const trimmed = name.trim();
    const parts = trimmed.split(/\s+/);
    if (parts.length < 2 || parts[0].length < 2 || parts[1].length < 2) {
        return { valid: false, msg: "Vänligen ange både ditt riktiga för- och efternamn." };
    }
    const lower = trimmed.toLowerCase();
    for (let word of BANNED_WORDS) {
        if (lower.includes(word)) {
            return { valid: false, msg: "Vänligen ange ditt riktiga namn." };
        }
    }
    return { valid: true };
}

async function getExams() {
    let exams = [];
    if (db) {
        try {
            const { data, error } = await db.from('exams').select('*');
            if (!error && data && data.length > 0) exams = data;
        } catch (e) {}
    }
    if (exams.length === 0) exams = localExamsFallback;

    exams.sort((a, b) => {
        const tA = parseInt((a.id || '').replace('ex-', '')) || 0;
        const tB = parseInt((b.id || '').replace('ex-', '')) || 0;
        return tB - tA;
    });
    
    state.cachedExams = exams;
    return exams;
}

async function saveExamToDB(exam) {
    if (!exam.submissions) exam.submissions = [];
    
    const localIdx = localExamsFallback.findIndex(e => e.id === exam.id);
    if (localIdx !== -1) localExamsFallback[localIdx] = exam;
    else localExamsFallback.unshift(exam);
    localStorage.setItem('waltelius_local_exams', JSON.stringify(localExamsFallback));

    const cacheIdx = state.cachedExams.findIndex(e => e.id === exam.id);
    if (cacheIdx !== -1) state.cachedExams[cacheIdx] = exam;
    else state.cachedExams.unshift(exam);

    if (!db) return true;
    try {
        await db.from('exams').upsert(exam);
        return true;
    } catch (e) {
        return true;
    }
}

async function deleteExamFromDB(examId) {
    localExamsFallback = localExamsFallback.filter(e => e.id !== examId);
    localStorage.setItem('waltelius_local_exams', JSON.stringify(localExamsFallback));

    state.cachedExams = state.cachedExams.filter(e => e.id !== examId);

    if (db) {
        try {
            await db.from('exams').delete().eq('id', examId);
        } catch (e) {}
    }
}

function startTimer() {
    stopTimer();
    state.examTimer = setInterval(() => {
        state.examSeconds++;
        const el = document.getElementById('digitalClock');
        if (el) {
            const mins = Math.floor(state.examSeconds / 60);
            el.innerText = `${mins} min`;
        }
    }, 1000);
}

function stopTimer() {
    if (state.examTimer) {
        clearInterval(state.examTimer);
        state.examTimer = null;
    }
}

function setupCheatDetection() {
    document.onvisibilitychange = () => {
        if (document.hidden && state.view === 'student_exam') {
            triggerCheatWarning();
        }
    };
}

function triggerCheatWarning() {
    state.warningCount++;
    stopTimer();

    const modal = document.getElementById('cheatWarningModal');
    if (!modal) return;

    if (state.warningCount === 1) {
        document.getElementById('warningTitle').innerText = "Gult Kort: Du lämnade sidan!";
        document.getElementById('warningMessage').innerText = "Du har lämnat provfönstret 1 gång. Om du lämnar sidan igen låses ditt prov.";
        modal.classList.remove('hidden');
    } else if (state.warningCount >= 2) {
        document.getElementById('warningTitle').innerText = "Rött Kort: Provet låst!";
        document.getElementById('warningMessage').innerText = "Ditt prov har låsts eftersom du lämnat sidan upprepade gånger.";
        modal.classList.remove('hidden');
    }
}

function closeWarningModal() {
    const modal = document.getElementById('cheatWarningModal');
    if (modal) modal.classList.add('hidden');

    if (state.warningCount >= 2) {
        goHome();
    } else {
        startTimer();
    }
}

async function render() {
    const app = document.getElementById('app');
    const navRight = document.getElementById('navRight');
    if (!app) return;

    if (navRight) {
        if (state.view.startsWith('admin')) {
            navRight.innerHTML = `<button onclick="switchView('welcome')" class="text-sm font-semibold text-slate-600 hover:text-red-600">Lämna Testpanelen</button>`;
        } else {
            navRight.innerHTML = `<button onclick="switchView('admin')" class="text-sm font-semibold text-slate-600 hover:text-red-600">Testpanelen</button>`;
        }
    }

    const exams = await getExams();

    if (state.view === 'admin') {
        renderAdmin(app, exams);
    } else if (state.view === 'admin_board') {
        renderAdminBoard(app, exams);
    } else if (state.view === 'admin_edit') {
        renderAdminEdit(app);
    } else if (state.view === 'student_code') {
        renderStudentCode(app);
    } else if (state.view === 'student_exam') {
        renderStudentExam(app);
    } else if (state.view === 'student_result') {
        renderStudentResult(app);
    } else {
        renderWelcome(app, exams);
    }
}

function renderWelcome(container, exams) {
    const savedName = localStorage.getItem('waltelius_student_name') || '';
    const activeExams = exams.filter(e => (e.active === true || e.active === 'true') && e.archived !== true);
    const allClasses = [...new Set(exams.map(e => e.klass))];
    const displayClasses = allClasses.length > 0 ? allClasses : ['7H', '8H', '9H'];

    container.innerHTML = `
        <div class="max-w-xl mx-auto mt-6 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8">
            <div class="text-center mb-8">
                <span class="inline-block px-3 py-1 bg-red-100 text-red-700 text-xs font-bold rounded-full uppercase tracking-wider mb-2">Elevportal</span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Välkommen till Waltelius<span class="text-red-600">.testar</span></h2>
                <p class="text-sm text-slate-600 mt-2">Fyll i namn och välj din klass för att hitta din uppgift.</p>
            </div>

            <form onsubmit="handleWelcomeSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Ditt För- och Efternamn</label>
                    <input type="text" id="studentName" required value="${savedName}" placeholder="t.ex. Anna Svensson" 
                        autocomplete="off" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Klass</label>
                    <select id="studentClass" required onchange="updateExamDropdown()" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 bg-white">
                        <option value="">-- Välj din klass --</option>
                        ${displayClasses.map(c => `<option value="${c}">${c}</option>`).join('')}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Välj Material / Uppgift</label>
                    <select id="studentExamSelect" required disabled class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 bg-white disabled:bg-slate-100">
                        <option value="">-- Välj klass först --</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-lg transition">
                    Gå vidare till kod →
                </button>
            </form>
        </div>
    `;
}

function updateExamDropdown() {
    const klass = document.getElementById('studentClass').value;
    const select = document.getElementById('studentExamSelect');
    const exams = state.cachedExams.filter(e => e.klass === klass && (e.active === true || e.active === 'true') && e.archived !== true);

    if (!klass || exams.length === 0) {
        select.innerHTML = '<option value="">-- Inga aktiva uppgifter för ' + (klass || 'vald klass') + ' --</option>';
        select.disabled = true;
        return;
    }

    select.disabled = false;
    select.innerHTML = '<option value="">-- Välj uppgift --</option>' + 
        exams.map(e => `<option value="${e.id}">${e.title} (${e.type} - ${e.category})</option>`).join('');
}

function handleWelcomeSubmit(e) {
    e.preventDefault();
    const nameInput = document.getElementById('studentName').value;
    const validation = validateStudentName(nameInput);
    if (!validation.valid) {
        alert(validation.msg);
        return;
    }

    const name = nameInput.trim();
    localStorage.setItem('waltelius_student_name', name);

    const klass = document.getElementById('studentClass').value;
    const examId = document.getElementById('studentExamSelect').value;

    state.currentUser = { name, class: klass };
    state.activeExam = state.cachedExams.find(ex => ex.id === examId);
    switchView('student_code');
}

function renderStudentCode(container) {
    container.innerHTML = `
        <div class="max-w-md mx-auto mt-12 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 text-center">
            <div class="w-14 h-14 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-1">Ange Provkod</h2>
            <p class="text-xs text-slate-500 mb-6">Slå in koden för "${state.activeExam ? state.activeExam.title : ''}"</p>

            <form onsubmit="handleCodeSubmit(event)" class="space-y-4">
                <input type="text" id="inputCode" maxlength="4" required placeholder="0 0 0 0"
                    class="w-full text-center text-3xl font-mono tracking-widest py-3 border-2 border-slate-300 rounded-xl focus:border-red-600 outline-none uppercase">
                
                <div id="codeError" class="text-red-500 text-xs font-semibold hidden">Felaktig kod. Försök igen.</div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="switchView('welcome')" class="w-1/2 py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl">Tillbaka</button>
                    <button type="submit" class="w-1/2 py-3 bg-red-600 text-white font-semibold rounded-xl shadow-md">Starta uppgiften</button>
                </div>
            </form>
        </div>
    `;
}

function handleCodeSubmit(e) {
    e.preventDefault();
    const code = document.getElementById('inputCode').value.trim();
    if (code === state.activeExam.code) {
        state.answers = {};
        state.examSeconds = 0;
        state.warningCount = 0;
        state.view = 'student_exam';
        setupCheatDetection();
        startTimer();
        render();
    } else {
        document.getElementById('codeError').classList.remove('hidden');
    }
}

function renderStudentExam(container) {
    const exam = state.activeExam || {};
    const questions = exam.questions || [];
    const initialMins = Math.floor(state.examSeconds / 60);

    container.innerHTML = `
        <div class="max-w-2xl mx-auto space-y-6">
            <div class="bg-gradient-to-r from-red-600 to-red-800 text-white p-6 rounded-2xl shadow-md flex items-center justify-between">
                <div>
                    <span class="text-xs uppercase font-semibold opacity-80">${exam.type} • ${exam.category}</span>
                    <h2 class="text-2xl font-bold">${exam.title}</h2>
                    <p class="text-xs opacity-90 mt-1">Elev: ${state.currentUser.name} (${state.currentUser.class})</p>
                </div>
                <div class="bg-white/10 px-4 py-2 rounded-xl backdrop-blur-sm flex items-center gap-2 border border-white/20">
                    <i class="fa-regular fa-clock text-red-200"></i>
                    <span id="digitalClock" class="font-mono font-bold text-sm text-white">${initialMins} min</span>
                </div>
            </div>

            <form onsubmit="handleExamSubmit(event)" class="space-y-6">
                ${questions.length === 0 ? '<div class="bg-white p-6 rounded-2xl border text-center text-slate-400">Denna uppgift saknar frågor än så länge.</div>' : ''}
                ${questions.map((q, idx) => `
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <div class="text-xs font-bold text-red-600">Fråga ${idx + 1}</div>
                        <h3 class="text-base font-bold text-slate-900">${q.text || 'Läs frågan'}</h3>
                        <textarea required onchange="state.answers['q_${idx}'] = this.value" rows="4" 
                            placeholder="Skriv ditt svar här..." class="w-full p-3.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
                    </div>
                `).join('')}

                <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition">
                    Lämna in svar
                </button>
            </form>
        </div>
    `;
}

async function handleExamSubmit(e) {
    e.preventDefault();
    stopTimer();
    const exam = state.activeExam;
    
    const submission = {
        id: 'sub-' + Date.now(),
        studentName: state.currentUser.name,
        studentClass: state.currentUser.class,
        submittedAt: new Date().toLocaleString('sv-SE'),
        status: 'Inlämnat',
        secondsSpent: state.examSeconds,
        warnings: state.warningCount,
        gradeStatus: 'grey', // grey, yellow, green, red
        aiFeedback: '',
        answers: state.answers
    };

    if (!exam.submissions) exam.submissions = [];
    exam.submissions.push(submission);

    await saveExamToDB(exam);
    switchView('student_result');
}

function renderStudentResult(container) {
    const mins = Math.floor(state.examSeconds / 60);

    container.innerHTML = `
        <div class="max-w-xl mx-auto mt-8 bg-white p-8 rounded-2xl border border-slate-200 shadow-xl text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Inlämning mottagen!</h2>
            <p class="text-sm text-slate-600">Tack <strong>${state.currentUser ? state.currentUser.name : 'Elev'}</strong>, din uppgift har registrerats.</p>
            <p class="text-xs text-slate-400 font-mono">Tidsåtgång: ${mins} min ${state.warningCount > 0 ? '• Varningar: ' + state.warningCount : ''}</p>
            <button onclick="switchView('welcome')" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-md transition">
                Tillbaka till startsidan
            </button>
        </div>
    `;
}

// --- ADMIN & LÄRARÖVERSIKT ---
function renderAdmin(container, exams) {
    const isArchive = state.showArchive;
    const filteredExams = exams.filter(e => isArchive ? e.archived : !e.archived);

    container.innerHTML = `
        <div class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">${isArchive ? 'Arkiverade Uppgifter' : 'Testpanelen & Hantering'}</h2>
                    <p class="text-xs text-slate-500 mt-1">Klicka på "Aktivera" för att göra ett prov synligt för eleverna.</p>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="state.showArchive = !state.showArchive; render();" class="px-4 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">
                        <i class="fa-solid fa-box-archive mr-1"></i> ${isArchive ? 'Visa Aktiva' : 'Arkiv'}
                    </button>
                    ${!isArchive ? `
                        <button onclick="openCreateExamModal()" class="px-5 py-2.5 bg-red-600 text-white font-bold rounded-xl shadow-md text-xs">
                            + Skapa Ny Uppgift
                        </button>
                    ` : ''}
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-4 divide-y divide-slate-200">
                ${filteredExams.length === 0 ? `<div class="p-6 text-center text-slate-400">${isArchive ? 'Arkivet är tomt.' : 'Inga uppgifter. Skapa en ny ovan!'}</div>` : ''}
                ${filteredExams.map(e => `
                    <div class="py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div>
                            <div class="font-bold text-slate-900">${e.title || 'Utan titel'}</div>
                            <div class="text-xs text-slate-500 mt-0.5">
                                ${e.type} • ${e.category} • Klass ${e.klass} • Kod: <span class="font-mono font-bold text-red-600">${e.code}</span> • 
                                <span class="font-semibold ${e.active ? 'text-emerald-600' : 'text-slate-400'}">${e.active ? 'Aktiv' : 'Inaktiv'}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="toggleActive('${e.id}')" class="px-3 py-1.5 text-xs font-bold rounded-lg border ${e.active ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-emerald-600 text-white shadow-sm'}">
                                ${e.active ? 'Inaktivera' : 'Aktivera nu!'}
                            </button>
                            <button onclick="goToBoard('${e.id}')" class="px-2.5 py-1.5 bg-slate-100 text-slate-700 font-semibold rounded-lg text-xs">
                                Översikt
                            </button>
                            <button onclick="openEditExam('${e.id}')" class="px-2.5 py-1.5 bg-slate-100 text-slate-700 font-semibold rounded-lg text-xs">
                                Redigera
                            </button>
                            <button onclick="toggleArchive('${e.id}')" class="px-2.5 py-1.5 bg-amber-50 text-amber-700 border border-amber-200 font-semibold rounded-lg text-xs">
                                ${e.archived ? 'Återställ' : 'Arkivera'}
                            </button>
                            <button onclick="confirmDeleteExam('${e.id}', '${e.title}')" class="px-2.5 py-1.5 bg-red-50 text-red-600 border border-red-200 font-semibold rounded-lg text-xs">
                                Radera
                            </button>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

async function confirmDeleteExam(id, title) {
    if (confirm(`ÄR DU SÄKER?\n\nVill du verkligen radera uppgiften "${title}" permanent? Alla inlämnade elevsvar försvinner.`)) {
        await deleteExamFromDB(id);
        render();
    }
}

function goToBoard(id) {
    state.selectedExamId = id;
    switchView('admin_board');
}

function renderAdminBoard(container, exams) {
    const exam = exams.find(e => e.id === state.selectedExamId);
    if (!exam) return;
    const subs = exam.submissions || [];

    container.innerHTML = `
        <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">${exam.title} - Elevöversikt</h2>
                    <p class="text-xs text-slate-500 mt-1">Klass ${exam.klass} • ${exam.type} • Totalt ${subs.length} inlämningar</p>
                </div>
                <button onclick="switchView('admin')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm">
                    Tillbaka
                </button>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                            <th class="p-4">Elev</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Tid</th>
                            <th class="p-4">Varningar</th>
                            <th class="p-4 text-center">Bedömning (Plupp)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 text-sm">
                        ${subs.length === 0 ? '<tr><td colspan="5" class="p-6 text-center text-slate-400">Inga elever har lämnat in ännu.</td></tr>' : ''}
                        ${subs.map(s => {
                            const mins = Math.floor((s.secondsSpent || 0) / 60);
                            const pluppColor = s.gradeStatus === 'green' ? 'bg-emerald-500 hover:bg-emerald-600' :
                                              s.gradeStatus === 'yellow' ? 'bg-amber-400 hover:bg-amber-500' :
                                              s.gradeStatus === 'red' ? 'bg-red-500 hover:bg-red-600' : 'bg-slate-300 hover:bg-slate-400';
                            
                            const pluppText = s.gradeStatus === 'green' ? 'Godkänd / Klar' :
                                             s.gradeStatus === 'yellow' ? 'Under granskning' :
                                             s.gradeStatus === 'red' ? 'Komplettering' : 'Ej påbörjad';

                            return `
                                <tr class="hover:bg-slate-50">
                                    <td class="p-4 font-bold text-slate-900 cursor-pointer text-red-600 hover:underline" onclick="openStudentDetailModal('${s.id}')">
                                        ${s.studentName} <i class="fa-solid fa-circle-info text-xs ml-1 opacity-60"></i>
                                    </td>
                                    <td class="p-4"><span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800">${s.status || 'Inlämnat'}</span></td>
                                    <td class="p-4 font-mono text-xs text-slate-500">${mins} min</td>
                                    <td class="p-4 text-xs font-semibold ${s.warnings > 0 ? 'text-amber-600' : 'text-slate-400'}">${s.warnings || 0} st</td>
                                    <td class="p-4 text-center">
                                        <button onclick="cyclePluppStatus('${s.id}')" title="Klicka för att skifta status" class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-bold text-white transition shadow-sm ${pluppColor}">
                                            <span class="w-2.5 h-2.5 rounded-full bg-white/80"></span>
                                            <span>${pluppText}</span>
                                        </button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

async function cyclePluppStatus(subId) {
    const exam = state.cachedExams.find(e => e.id === state.selectedExamId);
    if (!exam || !exam.submissions) return;
    const sub = exam.submissions.find(s => s.id === subId);
    if (sub) {
        const order = ['grey', 'yellow', 'green', 'red'];
        const currentIdx = order.indexOf(sub.gradeStatus || 'grey');
        sub.gradeStatus = order[(currentIdx + 1) % order.length];
        await saveExamToDB(exam);
        render();
    }
}

function openStudentDetailModal(subId) {
    const exam = state.cachedExams.find(e => e.id === state.selectedExamId);
    if (!exam || !exam.submissions) return;
    const sub = exam.submissions.find(s => s.id === subId);
    if (!sub) return;

    const mins = Math.floor((sub.secondsSpent || 0) / 60);

    const content = document.getElementById('studentDetailContent');
    content.innerHTML = `
        <div class="space-y-6">
            <div>
                <span class="text-xs font-bold text-red-600 uppercase tracking-wider">Elevsvar</span>
                <h2 class="text-2xl font-bold text-slate-900">${sub.studentName}</h2>
                <p class="text-xs text-slate-500">${exam.title} • Inlämnad: ${sub.submittedAt || ''} • Tid: ${mins} min</p>
            </div>

            <div class="space-y-4">
                ${(exam.questions || []).map((q, idx) => {
                    const ans = sub.answers ? sub.answers['q_' + idx] : 'Inget svar';
                    return `
                        <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-2">
                            <span class="font-bold text-xs text-slate-500">Fråga ${idx + 1}</span>
                            <h4 class="font-bold text-slate-800 text-sm">${q.text}</h4>${q.criteria ? `<div class="text-xs text-amber-700 bg-amber-50 p-2 rounded border border-amber-200"><strong>Bedömningskriterie:</strong> ${q.criteria}</div>` : ''}
                            <div class="p-3 bg-white rounded-lg border border-slate-200 text-xs font-mono text-slate-700 whitespace-pre-wrap">${ans || 'Inget svar'}</div>
                        </div>
                    `;
                }).join('')}
            </div>

            <div class="p-4 rounded-xl bg-purple-50 border border-purple-200 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-purple-800 uppercase flex items-center gap-1.5">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> AI-Genererad Respons & Feedback
                    </span>
                    <button onclick="generateAIFeedback('${sub.id}')" class="px-3 py-1 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-lg shadow-sm">
                        Generera AI-förslag
                    </button>
                </div>
                <textarea id="aiFeedbackArea" rows="3" placeholder="Klicka på knappen ovan för att skapa ett automatiskt responsförslag baserat på elevens svar och kriterier..." 
                    onchange="saveAIFeedback('${sub.id}', this.value)"
                    class="w-full p-3 rounded-lg border border-purple-200 text-xs bg-white text-slate-800 outline-none">${sub.aiFeedback || ''}</textarea>
            </div>
        </div>
    `;
    document.getElementById('studentDetailModal').classList.remove('hidden');
}

function generateAIFeedback(subId) {
    const exam = state.cachedExams.find(e => e.id === state.selectedExamId);
    if (!exam || !exam.submissions) return;
    const sub = exam.submissions.find(s => s.id === subId);
    if (!sub) return;

    const area = document.getElementById('aiFeedbackArea');
    if (area) {
        area.value = "Genererar förslag...";
    }

    setTimeout(async () => {
        let feedback = `Bra jobbat ${sub.studentName}! Du visar förståelse för uppgiften. `;
        const hasEmpty = Object.values(sub.answers || {}).some(v => !v || v.trim() === '');
        if (hasEmpty) {
            feedback += "Tänk på att utveckla dina resonemang lite mer på de frågor där du skrivit korta svar.";
        } else {
            feedback += "Dina svar är välformulerade och täcker in de viktigaste begreppen.";
        }
        sub.aiFeedback = feedback;
        if (area) area.value = feedback;
        await saveExamToDB(exam);
    }, 600);
}

async function saveAIFeedback(subId, val) {
    const exam = state.cachedExams.find(e => e.id === state.selectedExamId);
    if (!exam || !exam.submissions) return;
    const sub = exam.submissions.find(s => s.id === subId);
    if (sub) {
        sub.aiFeedback = val;
        await saveExamToDB(exam);
    }
}

function closeStudentDetailModal() {
    document.getElementById('studentDetailModal').classList.add('hidden');
}

function openCreateExamModal() {
    state.editingExam = {
        id: 'ex-' + Date.now(),
        title: '',
        type: 'Test',
        category: 'Historia',
        klass: '7H',
        code: Math.floor(1000 + Math.random() * 9000).toString(),
        active: true,
        archived: false,
        questions: []
    };
    switchView('admin_edit');
}

function openEditExam(id) {
    const exam = state.cachedExams.find(e => e.id === id) || localExamsFallback.find(e => e.id === id);
    if (exam) {
        state.editingExam = JSON.parse(JSON.stringify(exam));
        switchView('admin_edit');
    }
}

async function toggleActive(id) {
    const exam = state.cachedExams.find(e => e.id === id) || localExamsFallback.find(e => e.id === id);
    if (exam) {
        exam.active = !exam.active;
        await saveExamToDB(exam);
        render();
    }
}

async function toggleArchive(id) {
    const exam = state.cachedExams.find(e => e.id === id) || localExamsFallback.find(e => e.id === id);
    if (exam) {
        exam.archived = !exam.archived;
        if (exam.archived) exam.active = false;
        await saveExamToDB(exam);
        render();
    }
}

function syncFormToState() {
    if (!state.editingExam) return;
    const titleEl = document.getElementById('editTitle');
    if (titleEl) state.editingExam.title = titleEl.value;

    const klassSel = document.getElementById('editKlassSelect');
    if (klassSel) {
        if (klassSel.value === 'custom') {
            state.editingExam.klass = document.getElementById('editKlassCustom').value.trim();
        } else {
            state.editingExam.klass = klassSel.value;
        }
    }

    const codeEl = document.getElementById('editCode');
    if (codeEl) state.editingExam.code = codeEl.value.trim();

    const catEl = document.getElementById('editCategory');
    if (catEl) state.editingExam.category = catEl.value;

    const typeEl = document.getElementById('editType');
    if (typeEl) state.editingExam.type = typeEl.value;
}

function renderAdminEdit(container) {
    const exam = state.editingExam || {};
    const isCustomClass = !['7H', '8H', '9H'].includes(exam.klass);

    container.innerHTML = `
        <div class="max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 space-y-6">
            <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                <h2 class="text-2xl font-bold text-slate-900">${exam.title ? 'Redigera uppgift' : 'Skapa Ny Uppgift'}</h2>
                <button onclick="switchView('admin')" class="text-sm font-semibold text-slate-500">Avbryt</button>
            </div>

            <form onsubmit="saveEditedExam(event)" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Typ av uppgift</label>
                        <select id="editType" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                            <option value="Test" ${exam.type === 'Test' ? 'selected' : ''}>Test</option>
                            <option value="Entryticket" ${exam.type === 'Entryticket' ? 'selected' : ''}>Entryticket</option>
                            <option value="Exitticket" ${exam.type === 'Exitticket' ? 'selected' : ''}>Exitticket</option>
                            <option value="Träning" ${exam.type === 'Träning' ? 'selected' : ''}>Träning/Repetition</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ämne</label>
                        <select id="editCategory" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                            <option value="Historia" ${exam.category === 'Historia' ? 'selected' : ''}>Historia</option>
                            <option value="Geografi" ${exam.category === 'Geografi' ? 'selected' : ''}>Geografi</option>
                            <option value="Religion" ${exam.category === 'Religion' ? 'selected' : ''}>Religion</option>
                            <option value="Samhällskunskap" ${exam.category === 'Samhällskunskap' ? 'selected' : ''}>Samhällskunskap</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-end">
                    <div class="sm:col-span-5">
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Titel på uppgift</label>
                        <input type="text" id="editTitle" required value="${exam.title || ''}" placeholder="t.ex. Industriella Revolutionen"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm">
                    </div>

                    <div class="sm:col-span-3">
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Klass</label>
                        <select id="editKlassSelect" onchange="toggleCustomKlassInput(this.value)" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                            <option value="7H" ${exam.klass === '7H' ? 'selected' : ''}>7H</option>
                            <option value="8H" ${exam.klass === '8H' ? 'selected' : ''}>8H</option>
                            <option value="9H" ${exam.klass === '9H' ? 'selected' : ''}>9H</option>
                            <option value="custom" ${isCustomClass ? 'selected' : ''}>Egen klass...</option>
                        </select>
                        <input type="text" id="editKlassCustom" value="${isCustomClass ? exam.klass : ''}" placeholder="Skriv klass" 
                            class="${isCustomClass ? '' : 'hidden'} mt-2 w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                    </div>

                    <div class="sm:col-span-4">
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Provkod</label>
                        <div class="flex items-center space-x-1">
                            <input type="text" id="editCode" maxlength="4" required value="${exam.code || ''}"
                                class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm font-mono text-center">
                            <button type="button" onclick="refreshCode()" title="Slumpa ny kod" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl border border-slate-300 text-xs">
                                <i class="fa-solid fa-arrows-rotate"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="border-t border-slate-200 pt-5 space-y-4">
                    <h3 class="font-bold text-slate-900">Frågor & Bedömningskriterier</h3>
                    <div class="space-y-4">
                        ${(exam.questions || []).map((q, idx) => renderEditQuestionCard(q, idx, (exam.questions || []).length)).join('')}
                    </div>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                    <div class="space-x-2">
                        <button type="button" onclick="addTextQuestion()" class="px-3 py-2 bg-red-50 text-red-700 font-bold text-xs rounded-xl">+ Ny fråga</button>
                    </div>
                    <button type="submit" class="px-6 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs shadow-md">
                        Spara Uppgift
                    </button>
                </div>
            </form>
        </div>
    `;
}

function refreshCode() {
    const newCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('editCode').value = newCode;
    if (state.editingExam) state.editingExam.code = newCode;
}

function toggleCustomKlassInput(val) {
    const input = document.getElementById('editKlassCustom');
    if (val === 'custom') {
        input.classList.remove('hidden');
        input.required = true;
    } else {
        input.classList.add('hidden');
        input.required = false;
    }
}

function renderEditQuestionCard(q, idx, totalQuestions) {
    return `
        <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-3">
            <div class="flex items-center justify-between">
                <span class="font-bold text-xs text-red-600">Fråga ${idx + 1}</span>
                <div class="flex items-center space-x-1">
                    ${idx > 0 ? `<button type="button" onclick="moveQuestion(${idx}, -1)" title="Flytta upp" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▲</button>` : ''}
                    ${idx < totalQuestions - 1 ? `<button type="button" onclick="moveQuestion(${idx}, 1)" title="Flytta ner" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▼</button>` : ''}
                    <button type="button" onclick="removeQuestion(${idx})" class="text-red-500 text-xs ml-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <input type="text" value="${q.text || ''}" onchange="state.editingExam.questions[${idx}].text = this.value" placeholder="Skriv frågan..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
            <input type="text" value="${q.criteria || ''}" onchange="state.editingExam.questions[${idx}].criteria = this.value" placeholder="Bedömningskriterier / Nyckelbegrepp för läraren (valfritt)..." class="w-full px-3 py-1.5 rounded-lg border border-slate-200 text-xs bg-white text-slate-600">
        </div>
    `;
}

function moveQuestion(idx, direction) {
    syncFormToState();
    const questions = state.editingExam.questions;
    const targetIdx = idx + direction;
    if (targetIdx >= 0 && targetIdx < questions.length) {
        const temp = questions[idx];
        questions[idx] = questions[targetIdx];
        questions[targetIdx] = temp;
        render();
    }
}

function addTextQuestion() {
    syncFormToState();
    if (!state.editingExam.questions) state.editingExam.questions = [];
    state.editingExam.questions.push({ id: Date.now(), type: 'text', text: '', criteria: '' });
    render();
}

function removeQuestion(idx) {
    syncFormToState();
    state.editingExam.questions.splice(idx, 1);
    render();
}

async function saveEditedExam(e) {
    e.preventDefault();
    syncFormToState();
    const exam = state.editingExam;
    exam.active = true;
    await saveExamToDB(exam);
    switchView('admin');
}

document.addEventListener('DOMContentLoaded', render);
render();
</script>
</body>
</html>
