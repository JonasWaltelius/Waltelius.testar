    <!-- HELSKÄRMSLÄGE: VISA PÅ SKÄRM (PROJEKTOR / KLASSRUMSSTYRNING) -->

                </h3>

            </div>

<script>
const SUPABASE_URL = 'https://omjeuavtqdrktxohmebm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tamV1YXZ0cWRya3R4b2htZWJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNjkwMDAsImV4cCI6MjA1Njg0NTAwMH0.1_R5aR_u8-zN6lX_3-90d-_0';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ADMIN_PASS = '6768';
const BANNED_WORDS = ['fan', 'jävel', 'helvete', 'skit', 'kukk', 'fitta', 'hor', 'bajs', 'snopp', 'fart', 'idiot', 'knulla', 'hitler', 'stalin', 'bitch'];
let localExamsFallback = JSON.parse(localStorage.getItem('waltelius_local_exams') || '[]');

const state = {
    view: 'welcome',
    currentUser: null,
    selectedExamId: null,
    activeExam: null,
    answers: {},
    cachedExams: [],
    editingExam: null,
    showArchive: false,
    examTimer: null,
    examSeconds: 0,
    warningCount: 0,
    revealedCodes: {},
    projectorInterval: null,
    lastSubmittedData: null,
    isSubmitting: false,
    selectedLeftCard: null,
    matchingPairsState: {}
};

function enterFullScreen() {
    try {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) docEl.requestFullscreen();
        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
        else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
    } catch(e) {}
}

function exitFullScreen() {
    try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    } catch(e) {}
}

function handleAdminAuth(targetView = 'admin') {
    const isAuthed = localStorage.getItem('waltelius_admin_authed') === 'true';
    if (isAuthed) {
        switchView(targetView);
        return;
    }
    const input = prompt("Ange lösenord för Testpanelen:");
    if (input === ADMIN_PASS) {
        localStorage.setItem('waltelius_admin_authed', 'true');
        switchView(targetView);
    } else if (input !== null) {
        alert("Felaktigt lösenord!");
    }
}

function switchView(targetView) {
    stopTimer();
    stopProjectorSync();
    state.view = targetView;
    render();
}

function goHome() {
    stopTimer();
    stopProjectorSync();
    state.view = 'welcome';
    render();
}

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function validateStudentName(name) {
    const trimmed = name.trim();
    const parts = trimmed.split(/\s+/);
    if (parts.length < 2 || parts[0].length < 2 || parts[1].length < 2) {
        return { valid: false, msg: "Vänligen ange både ditt riktiga för- och efternamn." };
    }
    const lower = trimmed.toLowerCase();
    for (let word of BANNED_WORDS) {
        if (lower.includes(word)) {
            return { valid: false, msg: "Vänligen ange ditt riktiga namn." };
        }
    }
    return { valid: true };
}

async function getExams() {
    let exams = [];
    if (db) {
        try {
            const { data, error } = await db.from('exams').select('*');
            if (!error && data && data.length > 0) {
                exams = data;
            }
        } catch (e) {}
    }
    
    if (exams.length === 0) {
        exams = localExamsFallback;
    }

    exams.sort((a, b) => {
        const tA = parseInt((a.id || '').replace('ex-', '')) || 0;
        const tB = parseInt((b.id || '').replace('ex-', '')) || 0;
        return tB - tA;
    });
    
    state.cachedExams = exams;
    return exams;
}

async function saveExamToDB(exam) {
    if (!exam.submissions) exam.submissions = [];
    if (!exam.activeStudents) exam.activeStudents = [];
    
    const localIdx = localExamsFallback.findIndex(e => e.id === exam.id);
    if (localIdx !== -1) localExamsFallback[localIdx] = exam;
    else localExamsFallback.unshift(exam);
    localStorage.setItem('waltelius_local_exams', JSON.stringify(localExamsFallback));

    const cacheIdx = state.cachedExams.findIndex(e => e.id === exam.id);
    if (cacheIdx !== -1) state.cachedExams[cacheIdx] = exam;
    else state.cachedExams.unshift(exam);

    if (!db) return true;

    try {
        const payload = {
            id: exam.id,
            title: exam.title || '',
            type: exam.type || 'Test',
            category: exam.category || 'Historia',
            klass: exam.klass || '7H',
            code: exam.code || '1234',
            active: exam.active === true || exam.active === 'true',
            archived: exam.archived === true || exam.archived === 'true',
            questions: exam.questions || [],
            submissions: exam.submissions || [],
            activeStudents: exam.activeStudents || []
        };

        const { data, error } = await db.from('exams').upsert([payload]);
        if (error) {
            console.error("Spara i Supabase misslyckades:", error);
            alert("Varning: Sparades bara lokalt på enheten! Fel från databasen: " + error.message);
        }
        return true;
    } catch (e) {
        console.error("Nätverksfel vid sparning:", e);
        return true;
    }
}

async function deleteExamFromDB(examId) {
    localExamsFallback = localExamsFallback.filter(e => e.id !== examId);
    localStorage.setItem('waltelius_local_exams', JSON.stringify(localExamsFallback));
    state.cachedExams = state.cachedExams.filter(e => e.id !== examId);

    if (db) {
        try {
            await db.from('exams').delete().eq('id', examId);
        } catch (e) {}
    }
}

function startTimer() {
    stopTimer();
    state.examTimer = setInterval(() => {
        state.examSeconds++;
        const el = document.getElementById('digitalClock');
        if (el) {
            const mins = Math.floor(state.examSeconds / 60);
            el.innerText = `${mins} min`;
        }
    }, 1000);
}

function stopTimer() {
    if (state.examTimer) {
        clearInterval(state.examTimer);
        state.examTimer = null;
    }
}

function setupCheatDetection() {
    document.onvisibilitychange = async () => {
        if (document.hidden && state.view === 'student_exam') {
            await triggerCheatWarning();
        }
    };
    
    window.onbeforeunload = async () => {
        if (state.view === 'student_exam' && !state.isSubmitting) {
            await lockStudentCompletely();
        }
    };
}

async function lockStudentCompletely() {
    if (state.activeExam && state.currentUser) {
        const student = (state.activeExam.activeStudents || []).find(s => s.name === state.currentUser.name);
        if (student) {
            student.locked = true;
            student.warnings = 2;
            await saveExamToDB(state.activeExam);
        }
    }
}

async function triggerCheatWarning() {
    if (state.isSubmitting) return;
    state.warningCount++;
    stopTimer();

    if (state.activeExam && state.currentUser) {
        const student = (state.activeExam.activeStudents || []).find(s => s.name === state.currentUser.name);
        if (student) {
            student.warnings = state.warningCount;
            if (state.warningCount >= 2) student.locked = true;
            await saveExamToDB(state.activeExam);
        }
    }

    const modal = document.getElementById('cheatWarningModal');
    if (!modal) return;

    if (state.warningCount === 1) {
        document.getElementById('warningTitle').innerText = "Gult Kort: Du lämnade sidan!";
        document.getElementById('warningMessage').innerText = "Du har lämnat provfönstret 1 gång. Om du lämnar sidan igen låses ditt prov.";
        modal.classList.remove('hidden');
    } else if (state.warningCount >= 2) {
        document.getElementById('warningTitle').innerText = "Rött Kort: Provet låst!";
        document.getElementById('warningMessage').innerText = "Ditt prov har låsts eftersom du lämnat eller stängt sidan. Kontakta din lärare för att återuppta.";
        modal.classList.remove('hidden');
    }
}

function closeWarningModal() {
    const modal = document.getElementById('cheatWarningModal');
    if (modal) modal.classList.add('hidden');

    if (state.warningCount >= 2) {
        exitFullScreen();
        goHome();
    } else {
        startTimer();
    }
}

async function render() {
    const app = document.getElementById('app');
    const navRight = document.getElementById('navRight');
    if (!app) return;

    if (navRight) {
        if (state.view.startsWith('admin')) {
            navRight.innerHTML = `<button onclick="switchView('welcome')" class="text-sm font-semibold text-slate-600 hover:text-red-600">Lämna Testpanelen</button>`;
        } else {
            navRight.innerHTML = `<button onclick="handleAdminAuth('admin')" class="text-sm font-semibold text-slate-600 hover:text-red-600">Testpanelen</button>`;
        }
    }

    const exams = await getExams();

    if (state.view === 'admin') {
        renderAdmin(app, exams);
    } else if (state.view === 'admin_board') {
        renderAdminBoard(app, exams);
    } else if (state.view === 'admin_edit') {
        renderAdminEdit(app);
    } else if (state.view === 'student_code') {
        renderStudentCode(app);
    } else if (state.view === 'student_exam') {
        renderStudentExam(app);
    } else if (state.view === 'student_result') {
        renderStudentResult(app);
    } else {
        renderWelcome(app, exams);
    }
}

function renderWelcome(container, exams) {
    const savedName = localStorage.getItem('waltelius_student_name') || '';
    const activeExams = exams.filter(e => (e.active === true || e.active === 'true') && e.archived !== true);
    const allClasses = [...new Set(exams.map(e => e.klass))];
    const displayClasses = allClasses.length > 0 ? allClasses : ['7H', '8H', '9H'];

    container.innerHTML = `
        <div class="max-w-xl mx-auto mt-6 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8">
            <div class="text-center mb-8">
                <span class="inline-block px-3 py-1 bg-red-100 text-red-700 text-xs font-bold rounded-full uppercase tracking-wider mb-2">Elevportal</span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Välkommen till Waltelius<span class="text-red-600">.testar</span></h2>
                <p class="text-sm text-slate-600 mt-2">Fyll i namn och välj din klass för att hitta din uppgift.</p>
            </div>

            <form onsubmit="handleWelcomeSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Ditt För- och Efternamn</label>
                    <input type="text" id="studentName" required value="${savedName}" placeholder="t.ex. Anna Svensson" 
                        autocomplete="off" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Klass</label>
                    <select id="studentClass" required onchange="updateExamDropdown()" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 bg-white">
                        <option value="">-- Välj din klass --</option>
                        ${displayClasses.map(c => `<option value="${c}">${c}</option>`).join('')}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Välj Material / Uppgift</label>
                    <select id="studentExamSelect" required disabled class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 bg-white disabled:bg-slate-100">
                        <option value="">-- Välj klass först --</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-lg transition">
                    Gå vidare till kod →
                </button>
            </form>
        </div>
    `;
}

function updateExamDropdown() {
    const klass = document.getElementById('studentClass').value;
    const select = document.getElementById('studentExamSelect');
    const exams = state.cachedExams.filter(e => e.klass === klass && (e.active === true || e.active === 'true') && e.archived !== true);

    if (!klass || exams.length === 0) {
        select.innerHTML = '<option value="">-- Inga aktiva uppgifter för ' + (klass || 'vald klass') + ' --</option>';
        select.disabled = true;
        return;
    }

    select.disabled = false;
    select.innerHTML = '<option value="">-- Välj uppgift --</option>' + 
        exams.map(e => `<option value="${e.id}">${e.title} (${e.type} - ${e.category})</option>`).join('');
}

function handleWelcomeSubmit(e) {
    e.preventDefault();
    const nameInput = document.getElementById('studentName').value;
    const validation = validateStudentName(nameInput);
    if (!validation.valid) {
        alert(validation.msg);
        return;
    }

    const name = nameInput.trim();
    localStorage.setItem('waltelius_student_name', name);

    const klass = document.getElementById('studentClass').value;
    const examId = document.getElementById('studentExamSelect').value;

    const originalExam = state.cachedExams.find(ex => ex.id === examId);

    const deviceSubmittedKey = `submitted_device_${examId}`;
    if (localStorage.getItem(deviceSubmittedKey)) {
        alert("Denna enhet har redan skickat in ett svar på den här uppgiften! Om du behöver göra om uppgiften måste din lärare trycka på 'Ångra inlämningen' i översikten.");
        return;
    }

    const existingActiveStudent = (originalExam.activeStudents || []).find(s => s.name.toLowerCase() === name.toLowerCase());
    if (existingActiveStudent && existingActiveStudent.locked) {
        alert("Ditt prov är låst eftersom du tidigare stängde eller lämnade sidan. Be din lärare trycka på 'Återuppta' i översikten för att du ska kunna logga in igen.");
        return;
    }

    const hasAlreadySubmitted = (originalExam.submissions || []).some(s => s.studentName.toLowerCase() === name.toLowerCase());
    if (hasAlreadySubmitted) {
        alert("En elev med detta namn har redan lämnat in denna uppgift! Om du vill göra om den, kontakta din lärare.");
        return;
    }

    let preparedQuestions = (originalExam.questions || []).map((q) => {
        const qCopy = { ...q };
        if (q.type === 'mcq' && q.options) {
            qCopy.options = shuffleArray(q.options);
        }
        return qCopy;
    });

    if (['Entryticket', 'Exitticket'].includes(originalExam.type)) {
        preparedQuestions = shuffleArray(preparedQuestions);
    }

    state.currentUser = { name, class: klass };
    state.activeExam = { ...originalExam, questions: preparedQuestions };
    state.matchingPairsState = {};
    switchView('student_code');
}

function renderStudentCode(container) {
    container.innerHTML = `
        <div class="max-w-md mx-auto mt-12 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 text-center">
            <div class="w-14 h-14 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-1">Ange Provkod</h2>
            <p class="text-xs text-slate-500 mb-6">Slå in koden för "${state.activeExam ? state.activeExam.title : ''}"</p>

            <form onsubmit="handleCodeSubmit(event)" class="space-y-4">
                <input type="text" id="inputCode" maxlength="4" required placeholder="0 0 0 0"
                    class="w-full text-center text-3xl font-mono tracking-widest py-3 border-2 border-slate-300 rounded-xl focus:border-red-600 outline-none uppercase">
                
                <div id="codeError" class="text-red-500 text-xs font-semibold hidden">Felaktig kod. Försök igen.</div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="switchView('welcome')" class="w-1/2 py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl">Tillbaka</button>
                    <button type="submit" class="w-1/2 py-3 bg-red-600 text-white font-semibold rounded-xl shadow-md">Starta uppgiften</button>
                </div>
            </form>
        </div>
    `;
}

async function handleCodeSubmit(e) {
    e.preventDefault();
    const code = document.getElementById('inputCode').value.trim();
    if (code === state.activeExam.code) {
        state.answers = {};
        state.examSeconds = 0;
        state.warningCount = 0;
        state.isSubmitting = false;

        enterFullScreen();

        if (!state.activeExam.activeStudents) state.activeExam.activeStudents = [];
        const existingIdx = state.activeExam.activeStudents.findIndex(s => s.name === state.currentUser.name);
        if (existingIdx !== -1) {
            state.activeExam.activeStudents[existingIdx].locked = false;
        } else {
            state.activeExam.activeStudents.push({
                name: state.currentUser.name,
                class: state.currentUser.class,
                joinedAt: new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }),
                warnings: 0,
                locked: false
            });
        }
        await saveExamToDB(state.activeExam);

        state.view = 'student_exam';
        setupCheatDetection();
        startTimer();
        render();
        setTimeout(drawMatchingLines, 100);
    } else {
        document.getElementById('codeError').classList.remove('hidden');
    }
}

function renderStudentQuestion(q, idx, isTicket) {
    const qType = q.type || 'text';

    if (qType === 'matching') {
        if (!state.matchingPairsState[idx]) {
            const leftItems = (q.pairs || []).map((p, pIdx) => ({ id: pIdx, text: p.left }));
            const rightItems = shuffleArray((q.pairs || []).map((p, pIdx) => ({ id: pIdx, text: p.right })));
            state.matchingPairsState[idx] = { leftItems, rightItems, connections: {} };
        }
        const matchState = state.matchingPairsState[idx];

        return `
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 relative" id="matching-container-${idx}">
                <svg class="svg-canvas" id="matching-svg-${idx}"></svg>
                <div class="text-xs font-bold text-red-600">Uppgift ${idx + 1}: Para ihop</div>
                <h3 class="text-base font-bold text-slate-900">${q.text || 'Koppla samman rätt begrepp med rätt förklaring'}</h3>
                <p class="text-xs text-slate-500">Klicka på ett begrepp till vänster och sedan på rätt förklaring till höger för att dra en linje.</p>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 pt-2 relative z-10">
                    <div class="space-y-3">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Begrepp</span>
                        ${matchState.leftItems.map(l => {
                            const pairedRightId = matchState.connections[l.id];
                            const isPaired = pairedRightId !== undefined;
                            const isSelected = state.selectedLeftCard && state.selectedLeftCard.qIdx === idx && state.selectedLeftCard.lId === l.id;
                            
                            let cardClass = 'bg-slate-50 border-slate-200 text-slate-800';
                            if (isSelected) cardClass = 'bg-red-50 border-red-500 text-red-900 font-bold shadow-sm';
                            else if (isPaired) cardClass = 'bg-red-50 border-red-500 text-red-900 font-bold shadow-sm';

                            return `
                                <div id="left-card-${idx}-${l.id}" onclick="selectLeftCard(${idx}, ${l.id})" class="match-card p-3.5 rounded-xl border-2 text-sm flex items-center justify-between ${cardClass}">
                                    <span>${l.text}</span>
                                    <span class="w-3 h-3 rounded-full ${isPaired ? 'bg-red-600' : 'bg-slate-300'}"></span>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="space-y-3">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Förklaringar / Kopplingar</span>
                        ${matchState.rightItems.map(r => {
                            const connectedLeftId = Object.keys(matchState.connections).find(k => matchState.connections[k] === r.id);
                            const isPaired = connectedLeftId !== undefined;
                            
                            let cardClass = 'bg-slate-50 border-slate-200 text-slate-800';
                            if (isPaired) cardClass = 'bg-red-50 border-red-500 text-red-900 font-bold shadow-sm';

                            return `
                                <div id="right-card-${idx}-${r.id}" onclick="selectRightCard(${idx},${r.id})" class="match-card p-3.5 rounded-xl border-2 text-sm flex items-center justify-between ${cardClass}">
                                    <span class="w-3 h-3 rounded-full ${isPaired ? 'bg-red-600' : 'bg-slate-300'}"></span>
                                    <span>${r.text}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    if (qType === 'mcq') {
        const options = q.options || [];
        const correctCount = (q.correctOptions || []).length || 1;
        const currentSelected = state.answers['q_' + idx] || [];

        return `
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="text-xs font-bold text-red-600">Fråga ${idx + 1}: Välj rätt alternativ</div>

                </p>

                    ${options.map((opt, optIdx) => {
                        const isChecked = Array.isArray(currentSelected) && currentSelected.includes(opt);
                        return `
                            <label class="flex items-center space-x-3 p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer text-sm">

            ${!isTicket && q.criteria ? `<div class="text-xs text-amber-800 bg-amber-50 p-2.5 rounded-lg border border-amber-200"><strong>Betygskrav för nivån:</strong> ${q.criteria}</div>` : ''}
            <textarea required onpaste="return false" oncopy="return false" oncut="return false" onchange="state.answers['q_${idx}'] = this.value" rows="3" 
                placeholder="${isTicket ? 'Skriv förklaring/resonemang kring begreppet...' : 'Skriv ditt svar här...'}" class="w-full p-3.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-500 outline-none text-sm"></textarea>
        </div>
    `;
}

function drawMatchingLines() {
    Object.keys(state.matchingPairsState).forEach(qIdx => {
        const svg = document.getElementById(`matching-svg-${qIdx}`);
        const container = document.getElementById(`matching-container-${qIdx}`);
        if (!svg || !container) return;

        svg.innerHTML = '';
        const containerRect = container.getBoundingClientRect();
        const connections = state.matchingPairsState[qIdx].connections || {};

        Object.keys(connections).forEach(lId => {
            const rId = connections[lId];
            const leftCard = document.getElementById(`left-card-${qIdx}-${lId}`);
            const rightCard = document.getElementById(`right-card-${qIdx}-${rId}`);

            if (leftCard && rightCard) {
                const lRect = leftCard.getBoundingClientRect();
                const rRect = rightCard.getBoundingClientRect();

                const x1 = lRect.right - containerRect.left;
                const y1 = lRect.top + lRect.height / 2 - containerRect.top;
                const x2 = rRect.left - containerRect.left;
                const y2 = rRect.top + rRect.height / 2 - containerRect.top;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', '#dc2626');
                line.setAttribute('stroke-width', '3.5');
                line.setAttribute('stroke-linecap', 'round');
                svg.appendChild(line);
            }
        });
    });
}

function selectLeftCard(qIdx, lId) {
    state.selectedLeftCard = { qIdx, lId };
    render();
}

function selectRightCard(qIdx, rId) {
    if (state.selectedLeftCard && state.selectedLeftCard.qIdx === qIdx) {
        const lId = state.selectedLeftCard.lId;
        state.matchingPairsState[qIdx].connections[lId] = rId;
        state.selectedLeftCard = null;

        const formattedAnswers = Object.keys(state.matchingPairsState[qIdx].connections).map(lKey => {
            const leftText = state.matchingPairsState[qIdx].leftItems.find(item => item.id == lKey)?.text;
            const rightText = state.matchingPairsState[qIdx].rightItems.find(item => item.id == state.matchingPairsState[qIdx].connections[lKey])?.text;
            return `${leftText} -> ${rightText}`;
        });
        state.answers['q_' + qIdx] = formattedAnswers.join(', ');
        render();
    }
}

function toggleMcqOption(qIdx, optionText, isChecked) {
    if (!Array.isArray(state.answers['q_' + qIdx])) {
        state.answers['q_' + qIdx] = [];
    }
    if (isChecked) {
        if (!state.answers['q_' + qIdx].includes(optionText)) {
            state.answers['q_' + qIdx].push(optionText);
        }
    } else {
        state.answers['q_' + qIdx] = state.answers['q_' + qIdx].filter(item => item !== optionText);
    }
}

async function evaluateAnswersWithAI(questions, answers, isTicket, studentName) {
    const firstName = (studentName || 'Elev').split(' ')[0];

    try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/evaluate-answers`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify({ questions, answers, isTicket, studentFirstName: firstName })
        });

        if (!response.ok) throw new Error("AIFunktionsfel");
        const data = await response.json();
        if (data.questionResults && data.summaryComment) {
            return data;
        }
        throw new Error("Felaktigt format");
    } catch (e) {
        const questionResults = questions.map((q, idx) => {
            const rawAns = answers['q_' + idx];
            const qType = q.type || 'text';

            if (qType === 'matching') {
                const pairs = q.pairs || [];
                let correctPairsCount = 0;
                const studentPairsStr = typeof rawAns === 'string' ? rawAns : '';

                pairs.forEach(p => {
                    if (studentPairsStr.includes(`${p.left} -> ${p.right}`)) {
                        correctPairsCount++;
                    }
                });

                const isAllCorrect = correctPairsCount === pairs.length && pairs.length > 0;
                return {
                    questionIdx: idx + 1,
                    questionText: q.text,
                    studentAnswer: studentPairsStr || 'Inga kopplingar gjorda',
                    plupp: isAllCorrect ? 'lightgreen' : 'red',
                    statusText: isAllCorrect ? 'Alla kopplingar rätt' : `${correctPairsCount} av ${pairs.length} rätta kopplingar`,
                    hintText: isAllCorrect ? 'Snyggt kopplat! Alla begrepp stämmer överens med facit.' : 'Några kopplingar stämde inte. Se över facit och ge konkreta exempel nästa gång.'
                };
            }

            if (qType === 'mcq') {
                const correctOpts = q.correctOptions || [];
                const studentSelected = Array.isArray(rawAns) ? rawAns : [];

                let correctSelectedCount = 0;
                let wrongSelectedCount = 0;

                studentSelected.forEach(opt => {
                    if (correctOpts.includes(opt)) correctSelectedCount++;
                    else wrongSelectedCount++;
                });

                let points = 0;
                if (correctOpts.length === 2) {
                    if (correctSelectedCount === 2 && wrongSelectedCount === 0) points = 2;
                    else if (correctSelectedCount === 1 && wrongSelectedCount === 0) points = 1;
                    else if (correctSelectedCount === 1 && wrongSelectedCount === 1) points = 1;
                    else points = 0;
                } else {
                    points = (correctSelectedCount === correctOpts.length && wrongSelectedCount === 0) ? 2 : (correctSelectedCount > 0 ? 1 : 0);
                }

                const plupp = points === 2 ? 'darkgreen' : points === 1 ? 'lightgreen' : 'red';
                return {
                    questionIdx: idx + 1,
                    questionText: q.text,
                    studentAnswer: studentSelected.join(', ') || 'Inget valt',
                    plupp: plupp,
                    statusText: `Poäng: ${points}p (${points === 2 ? 'Full pott' : points === 1 ? 'Delvis rätt' : 'Felaktigt'})`,
                    hintText: points === 2 ? 'Alla korrekta alternativ valdes!' : `Korrekt facit: ${correctOpts.join(', ')}`
                };
            }

            const ansStr = (rawAns || '').trim();
            const plupp = ansStr.length > 80 ? 'darkgreen' : ansStr.length >= 20 ? 'lightgreen' : 'red';
            return {
                questionIdx: idx + 1,
                questionText: q.text,
                studentAnswer: ansStr || 'Inget svar',
                plupp: plupp,
                statusText: plupp === 'darkgreen' ? 'Välutvecklat (A-nivå)' : plupp === 'lightgreen' ? 'Godkänt (E/C-nivå)' : 'Ofullständigt / Ej godkänt',
                hintText: q.criteria ? `Resonemangstips: ${q.criteria}` : 'Utveckla din motivering och ge konkreta exempel, såsom orsaker eller konsekvenser.'
            };
        });

        return {
            questionResults,
            summaryComment: `Fint arbetat med uppgiften, ${firstName}! Se över den specifika återkopplingen för respektive fråga ovan för att fördjupa dina resonemang ytterligare.`
        };
    }
}

async function handleExamSubmit(e) {
    e.preventDefault();
    state.isSubmitting = true;
    stopTimer();
    exitFullScreen();

    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Genererar återkoppling...</span>`;
    }

    const exam = state.activeExam;
    const isTicket = ['Entryticket', 'Exitticket'].includes(exam.type);

    localStorage.setItem(`submitted_device_${exam.id}`, 'true');

    if (exam.activeStudents) {
        exam.activeStudents = exam.activeStudents.filter(s => s.name !== state.currentUser.name);
    }

    const aiEvaluation = await evaluateAnswersWithAI(exam.questions || [], state.answers, isTicket, state.currentUser.name);

    const submission = {
        id: 'sub-' + Date.now(),
        studentName: state.currentUser.name,
        studentClass: state.currentUser.class,
        submittedAt: new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }),
        status: 'Inlämnat',
        secondsSpent: state.examSeconds,
        warnings: state.warningCount,
        reviewed: false,
        questionResults: aiEvaluation.questionResults || [],
        summaryComment: aiEvaluation.summaryComment || '',
        answers: state.answers
    };

    if (!exam.submissions) exam.submissions = [];
    exam.submissions.push(submission);

    await saveExamToDB(exam);
    state.lastSubmittedData = submission;
    switchView('student_result');
}

async function updateProjectorLists() {
    const exams = await getExams();
    const exam = exams.find(e => e.id === state.selectedExamId);
    if (!exam) return;

    const isActive = (exam.active === true || exam.active === 'true');
    const ongoingTitleEl = document.getElementById('projOngoingTitle');
    
    if (ongoingTitleEl) {
        if (isActive) {
            ongoingTitleEl.className = "text-lg font-bold text-amber-400 mb-4 flex items-center gap-2";
            ongoingTitleEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Pågående (<span id="countOngoing">0</span>)`;
        } else {
            ongoingTitleEl.className = "text-lg font-bold text-slate-400 mb-4 flex items-center gap-2";
            ongoingTitleEl.innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> Ej inlämnad (<span id="countOngoing">0</span>)`;
        }
    }

    const ongoing = exam.activeStudents || [];
    const submitted = exam.submissions || [];

    document.getElementById('countOngoing').innerText = ongoing.length;
    document.getElementById('countSubmitted').innerText = submitted.length;

    const listOngoing = document.getElementById('listOngoing');
    listOngoing.innerHTML = ongoing.length === 0 ? '<div class="col-span-2 text-xs text-slate-500 py-2">Inga elever för stunden.</div>' :
        ongoing.map(s => `
            <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-800 border border-slate-700/80 text-xs">
                <div class="flex items-center space-x-1.5 truncate">
                    <span class="font-bold text-slate-200 truncate">${s.name}</span>
                    ${s.warnings === 1 ? '<span class="px-1.5 py-0.5 bg-amber-500/20 text-amber-400 text-[10px] font-bold rounded-full border border-amber-500/40">Gult</span>' : ''}
                    ${s.locked ? '<span class="px-1.5 py-0.5 bg-red-500/20 text-red-400 text-[10px] font-bold rounded-full border border-red-500/40">Låst</span>' : ''}
                </div>
                <div class="flex items-center space-x-1 ml-1 flex-shrink-0">
                    <span class="text-[10px] font-mono text-slate-400">${s.joinedAt || ''}</span>
                    ${s.locked ? `
                        <button onclick="adminResumeStudent('${s.name}')" class="px-2 py-0.5 bg-emerald-600 text-white font-bold text-[10px] rounded">
                            Lås upp
                        </button>
                    ` : ''}
                </div>
            </div>
        `).join('');

    const listSubmitted = document.getElementById('listSubmitted');
    listSubmitted.innerHTML = submitted.length === 0 ? '<div class="col-span-2 text-xs text-slate-500 py-2">Inga elever har lämnat in ännu.</div>' :
        submitted.map(s => `
            <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-800 border border-slate-700/80 text-xs">
                <span class="font-bold text-slate-200 truncate">${s.studentName}</span>
                <span class="text-[10px] font-mono text-slate-400 ml-1 flex-shrink-0">${s.submittedAt || ''}</span>
            </div>
        `).join('');
}

async function adminResumeStudent(studentName) {
    const exam = state.cachedExams.find(e => e.id === state.selectedExamId);
    if (!exam || !exam.activeStudents) return;
    const student = exam.activeStudents.find(s => s.name === studentName);
    if (student) {
        student.locked = false;
        student.warnings = 0;
        await saveExamToDB(exam);
        updateProjectorLists();
    }
}

async function toggleStudentReviewed(subId) {
    const exam = state.cachedExams.find(e => e.id === state.selectedExamId);
    if (!exam || !exam.submissions) return;
    const sub = exam.submissions.find(s => s.id === subId);
    if (sub) {
        sub.reviewed = !sub.reviewed;
        await saveExamToDB(exam);
        render();
    }
}

async function confirmResetSubmission(subId, studentName) {
    if (confirm(`ÄR DU SÄKER?\n\nVill du verkligen ångra inlämningen för ${studentName}?\nAlla svar för eleven raderas, enhetsspärren hävs och eleven kan starta om uppgiften.`)) {
        const exam = state.cachedExams.find(e => e.id === state.selectedExamId);
        if (exam) {
            localStorage.removeItem(`submitted_device_${exam.id}`);

            if (exam.submissions) {
                exam.submissions = exam.submissions.filter(s => s.id !== subId);
                await saveExamToDB(exam);
                render();
            }
        }
    }
}

                </div>
            </div>
        `;
    }

    if (qType === 'mcq') {
        return `
            <div class="p-4 rounded-xl border border-blue-200 bg-blue-50/40 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-xs text-blue-700 uppercase">Fråga ${idx + 1}: Välj rätt (Flerval)</span>
                    <div class="flex items-center space-x-1">
                        ${idx > 0 ? `<button type="button" onclick="moveQuestion(${idx}, -1)" title="Flytta upp" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▲</button>` : ''}
                        ${idx < totalQuestions - 1 ? `<button type="button" onclick="moveQuestion(${idx}, 1)" title="Flytta ner" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▼</button>` : ''}
                        <button type="button" onclick="removeQuestion(${idx})" class="text-red-500 text-xs ml-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
                <input type="text" value="${q.text || ''}" onchange="state.editingExam.questions[${idx}].text = this.value" placeholder="Fråga (t.ex. Vilka av följande var orsaker till revolutionen?)..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm font-semibold">
                
                <div class="space-y-2 pt-1">
                    <span class="text-xs font-bold text-slate-500 block">Svarsalternativ (Kryssa i de som är RÄTT):</span>
                    ${(q.options || []).map((opt, oIdx) => {
                        const isCorrect = (q.correctOptions || []).includes(opt);
                        return `
                            <div class="flex items-center gap-2">
                                <input type="checkbox" ${isCorrect ? 'checked' : ''} onchange="toggleMcqCorrect(${idx},${oIdx}, this.checked)" class="w-4 h-4 text-emerald-600 rounded">
                                <input type="text" value="${opt}" onchange="updateMcqOptionText(${idx}, ${oIdx}, this.value)" placeholder="Svarsalternativ ${oIdx + 1}..." class="flex-1 px-3 py-1.5 rounded-lg border border-slate-300 text-xs">
                                <button type="button" onclick="removeMcqOption(${idx},${oIdx})" class="text-red-500 text-xs px-1"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                    }).join('')}
                    <button type="button" onclick="addMcqOption(${idx})" class="px-2.5 py-1 bg-blue-100 text-blue-700 font-bold text-xs rounded-lg mt-1">+ Lägg till alternativ</button>
                </div>
            </div>
        `;
    }

    if (isTicket) {
        return `
            <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-xs text-red-600">Begrepp ${idx + 1}</span>
                    <div class="flex items-center space-x-1">
                        ${idx > 0 ? `<button type="button" onclick="moveQuestion(${idx}, -1)" title="Flytta upp" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▲</button>` : ''}
                        ${idx < totalQuestions - 1 ? `<button type="button" onclick="moveQuestion(${idx}, 1)" title="Flytta ner" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▼</button>` : ''}
                        <button type="button" onclick="removeQuestion(${idx})" class="text-red-500 text-xs ml-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
                <input type="text" value="${q.text || ''}" onchange="state.editingExam.questions[${idx}].text = this.value" placeholder="Rad 1: Begrepp (t.ex. Urbanisering)..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                <input type="text" value="${q.explanation || ''}" onchange="state.editingExam.questions[${idx}].explanation = this.value" placeholder="Rad 2: Förklaring/Svar för begreppet..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
            </div>
        `;
    }

    return `
        <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 space-y-3">
            <div class="flex items-center justify-between">
                <span class="font-bold text-xs text-red-600">Fråga ${idx + 1}</span>
                <div class="flex items-center space-x-1">
                    ${idx > 0 ? `<button type="button" onclick="moveQuestion(${idx}, -1)" title="Flytta upp" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▲</button>` : ''}
                    ${idx < totalQuestions - 1 ? `<button type="button" onclick="moveQuestion(${idx}, 1)" title="Flytta ner" class="p-1 px-2 bg-slate-200 hover:bg-slate-300 rounded text-xs">▼</button>` : ''}
                    <button type="button" onclick="removeQuestion(${idx})" class="text-red-500 text-xs ml-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <input type="text" value="${q.text || ''}" onchange="state.editingExam.questions[${idx}].text = this.value" placeholder="Rad 1: Frågan (t.ex. Varför startade Franska Revolutionen?)..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
            <input type="text" value="${q.explanation || ''}" onchange="state.editingExam.questions[${idx}].explanation = this.value" placeholder="Rad 2: Exempel på svarsalternativ/modellsvar..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
            <input type="text" value="${q.criteria || ''}" onchange="state.editingExam.questions[${idx}].criteria = this.value" placeholder="Rad 3: Krav (t.ex. För E - en orsak, för C - två orsaker, för A - tre orsaker)..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white text-slate-800">
        </div>
    `;
}

function moveQuestion(idx, direction) {
    syncFormToState();
    const questions = state.editingExam.questions;
    const targetIdx = idx + direction;
    if (targetIdx >= 0 && targetIdx < questions.length) {
        const temp = questions[idx];
        questions[idx] = questions[targetIdx];
        questions[targetIdx] = temp;
        render();
    }
}

function addTextQuestion() {
    syncFormToState();
    if (!state.editingExam.questions) state.editingExam.questions = [];
    state.editingExam.questions.push({ id: Date.now(), type: 'text', text: '', explanation: '', criteria: '' });
    render();
}

function addMatchingQuestion() {
    syncFormToState();
    if (!state.editingExam.questions) state.editingExam.questions = [];
    state.editingExam.questions.push({
        id: Date.now(),
        type: 'matching',
        text: 'Koppla samman rätt begrepp med rätt förklaring',
        pairs: [
            { left: '', right: '' },
            { left: '', right: '' }
        ]
    });
    render();
}

function addMatchingPair(qIdx) {
    syncFormToState();
    if (!state.editingExam.questions[qIdx].pairs) state.editingExam.questions[qIdx].pairs = [];
    state.editingExam.questions[qIdx].pairs.push({ left: '', right: '' });
    render();
}

function removeMatchingPair(qIdx, pIdx) {
    syncFormToState();
    state.editingExam.questions[qIdx].pairs.splice(pIdx, 1);
    render();
}

function addMcqQuestion() {
    syncFormToState();
    if (!state.editingExam.questions) state.editingExam.questions = [];
    state.editingExam.questions.push({
        id: Date.now(),
        type: 'mcq',
        text: '',
        options: ['', ''],
        correctOptions: []
    });
    render();
}

function addMcqOption(qIdx) {
    syncFormToState();
    if (!state.editingExam.questions[qIdx].options) state.editingExam.questions[qIdx].options = [];
    state.editingExam.questions[qIdx].options.push('');
    render();
}

function updateMcqOptionText(qIdx, oIdx, val) {
    syncFormToState();
    const oldVal = state.editingExam.questions[qIdx].options[oIdx];
    state.editingExam.questions[qIdx].options[oIdx] = val;
    
    if (!state.editingExam.questions[qIdx].correctOptions) state.editingExam.questions[qIdx].correctOptions = [];
    const cIdx = state.editingExam.questions[qIdx].correctOptions.indexOf(oldVal);
    if (cIdx !== -1) {
        state.editingExam.questions[qIdx].correctOptions[cIdx] = val;
    }
}

function toggleMcqCorrect(qIdx, oIdx, isChecked) {
    syncFormToState();
    const optVal = state.editingExam.questions[qIdx].options[oIdx];
    if (!state.editingExam.questions[qIdx].correctOptions) state.editingExam.questions[qIdx].correctOptions = [];
    
    if (isChecked) {
        if (optVal && !state.editingExam.questions[qIdx].correctOptions.includes(optVal)) {
            state.editingExam.questions[qIdx].correctOptions.push(optVal);
        }
    } else {
        state.editingExam.questions[qIdx].correctOptions = state.editingExam.questions[qIdx].correctOptions.filter(item => item !== optVal);
    }
}

function removeMcqOption(qIdx, oIdx) {
    syncFormToState();
    const optVal = state.editingExam.questions[qIdx].options[oIdx];
    state.editingExam.questions[qIdx].options.splice(oIdx, 1);
    if (state.editingExam.questions[qIdx].correctOptions) {
        state.editingExam.questions[qIdx].correctOptions = state.editingExam.questions[qIdx].correctOptions.filter(item => item !== optVal);
    }
    render();
}

function removeQuestion(idx) {
    syncFormToState();
    state.editingExam.questions.splice(idx, 1);
    render();
}

async function saveEditedExam(e) {
    e.preventDefault();
    syncFormToState();
    const exam = state.editingExam;
    exam.active = true;
    await saveExamToDB(exam);
    switchView('admin');
}

document.addEventListener('DOMContentLoaded', render);
render();
</script>
</body>
</html>
