<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waltelius Testar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .no-select { user-select: none; -webkit-user-select: none; }
        textarea, input { -webkit-user-select: text; }
        
        /* Tydliga färgnyanser för pluppar */
        .dot-darkgreen {
            background-color: #064e3b; /* Deep Forest Green */
            border: 2px solid #022c22;
            color: #ffffff;
        }
        .dot-lightgreen {
            background-color: #22c55e; /* Bright Light Green */
            border: 2px solid #15803d;
            color: #ffffff;
        }
        .dot-red {
            background-color: #ef4444; /* Red */
            border: 2px solid #b91c1c;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- NAV / HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md">
                    W
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-lg leading-tight">Waltelius testar</h1>
                </div>
            </div>

            <div class="flex items-center space-x-2" id="navRight"></div>
        </div>
    </header>

    <!-- HUVUDINNEHÅLL -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8" id="app"></main>

    <!-- MODAL FÖR FLIKBYTE (GULT/RÖTT KORT) -->
    <div id="cheatWarningModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center border-2 border-amber-500">
            <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-600 text-3xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2" id="warningTitle">Varning: Du lämnade sidan!</h3>
            <p class="text-sm text-slate-600 mb-6" id="warningMessage">
                Du lämnade provfönstret. Detta registreras i systemet och syns på lärarens skärm.
            </p>
            <button onclick="closeWarningModal()" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-xl shadow-md transition">
                Jag förstår, återgå
            </button>
        </div>
    </div>

    <!-- MODAL FÖR DYNAMISK GRANSKNING I ADMIN -->
    <div id="reviewModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden" onclick="closeReviewModal(event)">
        <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 sm:p-8 relative" onclick="event.stopPropagation()">
            <button onclick="closeReviewModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="reviewModalContent"></div>
        </div>
    </div>

    <script>
const SUPABASE_URL = 'https://omjeuavtqdrktxohmebm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tamV1YXZ0cWRya3R4b2htZWJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTY2MjUsImV4cCI6MjEwNjk3MjYyNX0.oJK8OcJzQnxGX2zG4y6HP1tGL1lPbQnuviKLkC2S1ro';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);      
        // Tillstånd (State)
        const state = {
            view: 'welcome', 
            currentUser: null, 
            selectedExamId: null,
            activeExam: null,
            warningCount: 0,
            hasCheatedModalShown: false,
            geminiApiKey: '', 
            answers: {}, 
            submittedResult: null,
            editingExam: null 
        };

        // Standarddata
        const defaultExams = [
            {
                id: 'ex-101',
                title: 'Industriella revolutionen',
                type: 'Test',
                category: 'Historia',
                klass: '8B',
                date: '2026-10-15',
                code: '5678',
                active: true,
                questions: [
                    {
                        id: 1,
                        type: 'text',
                        text: 'Förklara tre viktiga orsakar till att den industriella revolutionen startade i Storbritannien.',
                        criteria: 'Enkelt: Nämner råvaror/kapital. Utvecklat: Kopplar samman jordbruket, råvaror och ångmaskinen.'
                    },
                    {
                        id: 2,
                        type: 'mc',
                        text: 'Vilka uppfinningar var viktiga under denna period?',
                        options: ['Ångmaskinen', 'Spinning Jenny', 'Smartphonen', 'Glödlampan'],
                        correctOptions: [0, 1],
                        criteria: 'Ångmaskinen och Spinning Jenny är rätt.'
                    }
                ],
                submissions: generateMockSubmissions('ex-101')
            },
            {
                id: 'ex-102',
                title: 'Sveriges riksdag & regering',
                type: 'Entryticket',
                category: 'Samhällskunskap',
                klass: '8B',
                date: '2026-10-14',
                code: '9900',
                active: true,
                questions: [
                    { id: 1, type: 'concept', concept: 'Riksdag', criteria: 'Sveriges högsta beslutande organ, 349 ledamöter stiftar lagar.' },
                    { id: 2, type: 'concept', concept: 'Regering', criteria: 'Styr landet och genomför riksdagens beslut.' }
                ],
                submissions: generateMockSubmissions('ex-102')
            }
        ];

        function generateMockSubmissions(examId) {
            const names = ['Alice Svensson', 'Bob Carlsson', 'Charlie Ek', 'Diana Berg', 'Erik Lind', 'Filippa Holm'];
            return names.map((name, idx) => {
                let status = 'Inlämnat';
                let warnings = 0;
                let dots = ['darkgreen', 'lightgreen'];
                
                if (idx === 2) {
                    warnings = 1; // Gult kort
                } else if (idx === 4) {
                    warnings = 2; // Rött kort (Låst)
                    status = 'Låst (Rött kort)';
                    dots = ['red', 'red'];
                }

                return {
                    id: 'sub-' + idx,
                    examId: examId,
                    studentName: name,
                    studentClass: '8B',
                    submittedAt: '2026-10-14 10:' + (10 + idx),
                    status: status,
                    warnings: warnings,
                    answers: { 1: 'Ett bra svar från ' + name, 2: 'Svar del 2' },
                    feedback: dots.map((d, i) => ({
                        questionId: i + 1,
                        statusDot: d, 
                        text: d === 'red' ? 'Behöver övas mer på.' : (d === 'lightgreen' ? 'Godkänt och korrekt svar.' : 'Välutvecklat och strukturerat resonemang!')
                    }))
                };
            });
        }

        function getExams() {
            const stored = localStorage.getItem('wt_exams_v2');
            if (!stored) {
                localStorage.setItem('wt_exams_v2', JSON.stringify(defaultExams));
                return defaultExams;
            }
            return JSON.parse(stored);
        }

        function saveExams(exams) {
            localStorage.setItem('wt_exams_v2', JSON.stringify(exams));
        }

        // Huvudrendering
        function render() {
            const app = document.getElementById('app');
            const navRight = document.getElementById('navRight');

            if (state.view.startsWith('admin')) {
                navRight.innerHTML = `
                    <button onclick="state.view='welcome'; render();" class="text-sm font-medium text-slate-600 hover:text-slate-900 px-3 py-2 rounded-lg border border-slate-200 bg-white shadow-sm">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Lämna Testpanelen
                    </button>
                `;
            } else {
                navRight.innerHTML = `
                    <button onclick="state.view='admin'; render();" class="text-sm font-medium text-slate-700 hover:text-indigo-600 px-3 py-2 rounded-lg bg-slate-100 hover:bg-indigo-50 transition">
                        <i class="fa-solid fa-sliders mr-1"></i> Testpanelen
                    </button>
                `;
            }

            switch (state.view) {
                case 'welcome': renderWelcome(app); break;
                case 'student_code': renderStudentCode(app); break;
                case 'student_exam': renderStudentExam(app); break;
                case 'student_result': renderStudentResult(app); break;
                case 'admin': renderAdmin(app); break;
                case 'admin_screen': renderAdminScreen(app); break;
                case 'admin_board': renderAdminBoard(app); break;
                case 'admin_edit': renderAdminEdit(app); break;
            }
        }

        function goHome() {
            if (state.view === 'student_exam') {
                if (!confirm("Vill du verkligen lämna? Dina svar sparas inte.")) return;
            }
            state.view = 'welcome';
            render();
        }

        // --- VY: VÄLKOMSTSIDA ---
        function renderWelcome(container) {
            const exams = getExams();
            const activeClasses = [...new Set(exams.filter(e => e.active).map(e => e.klass))];

            container.innerHTML = `
                <div class="max-w-xl mx-auto mt-6 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8">
                    <div class="text-center mb-8">
                        <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-full uppercase tracking-wider mb-2">Elevportal</span>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Välkommen till Waltelius testar</h2>
                        <p class="text-sm text-slate-600 mt-2">
                            Fyll i ditt namn och välj din klass. Välj därefter uppgift och klicka på "Gå vidare till kod".
                        </p>
                    </div>

                    <form onsubmit="handleWelcomeSubmit(event)" class="space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Ditt För- och Efternamn</label>
                            <input type="text" id="studentName" required placeholder="t.ex. Anna Svensson" 
                                autocomplete="off" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Klass</label>
                            <select id="studentClass" required onchange="updateExamDropdown()" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white transition">
                                <option value="">-- Välj din klass --</option>
                                ${activeClasses.map(c => `<option value="${c}">${c}</option>`).join('')}
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Välj Material / Uppgift</label>
                            <select id="studentExamSelect" required disabled class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white transition disabled:bg-slate-100 disabled:text-slate-400">
                                <option value="">-- Välj klass först --</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg hover:shadow-indigo-200 transition transform active:scale-98 flex items-center justify-center space-x-2">
                            <span>Gå vidare till kod</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>
                </div>
            `;
        }

        function updateExamDropdown() {
            const klass = document.getElementById('studentClass').value;
            const select = document.getElementById('studentExamSelect');
            const exams = getExams().filter(e => e.active && e.klass === klass);

            if (!klass || exams.length === 0) {
                select.innerHTML = '<option value="">-- Inga aktiva uppgifter för vald klass --</option>';
                select.disabled = true;
                return;
            }

            select.disabled = false;
            select.innerHTML = '<option value="">-- Välj uppgift --</option>' + 
                exams.map(e => `<option value="${e.id}">${e.title} (${e.type} - ${e.category})</option>`).join('');
        }

        function handleWelcomeSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value.trim();
            const klass = document.getElementById('studentClass').value;
            const examId = document.getElementById('studentExamSelect').value;

            if (!name || !klass || !examId) return;

            const exams = getExams();
            const exam = exams.find(e => e.id === examId);

            const existingSub = exam.submissions && exam.submissions.find(s => s.studentName.toLowerCase() === name.toLowerCase() && s.studentClass === klass);
            
            if (existingSub && existingSub.status === 'Låst (Rött kort)') {
                alert("Ditt konto är tillfälligt låst på grund av fuskvarning. Be din lärare aktivera dig igen på skärmen.");
                return;
            } else if (existingSub && existingSub.status === 'Inlämnat') {
                alert("Du har redan lämnat in denna uppgift.");
                return;
            }

            state.currentUser = { name, class: klass };
            state.selectedExamId = examId;
            state.activeExam = exam;
            state.view = 'student_code';
            render();
        }

        // --- VY: INMATNING AV PROVKOD ---
        function renderStudentCode(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto mt-12 bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 text-center">
                    <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-1">Ange Provkod</h2>
                    <p class="text-xs text-slate-500 mb-6">Slå in den 4-siffriga koden som din lärare visar på tavlan.</p>

                    <form onsubmit="handleCodeSubmit(event)" class="space-y-4">
                        <input type="text" id="inputCode" maxlength="4" required placeholder="0 0 0 0"
                            class="w-full text-center text-3xl font-mono tracking-widest py-3 border-2 border-slate-300 rounded-xl focus:border-indigo-600 outline-none uppercase">
                        
                        <div id="codeError" class="text-red-500 text-xs font-semibold hidden">Felaktig kod. Försök igen.</div>

                        <div class="flex space-x-3 pt-2">
                            <button type="button" onclick="state.view='welcome'; render();" class="w-1/2 py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200">
                                Tillbaka
                            </button>
                            <button type="submit" class="w-1/2 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 shadow-md">
                                Starta
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function handleCodeSubmit(e) {
            e.preventDefault();
            const code = document.getElementById('inputCode').value.trim();
            const error = document.getElementById('codeError');

            if (code === state.activeExam.code) {
                state.warningCount = 0;
                state.hasCheatedModalShown = false;
                state.answers = {};
                
                // Registrera eleven i submissions som "Pågår" om inte redan där
                let exam = state.activeExam;
                if (!exam.submissions) exam.submissions = [];
                let sub = exam.submissions.find(s => s.studentName.toLowerCase() === state.currentUser.name.toLowerCase());
                if (!sub) {
                    exam.submissions.push({
                        id: 'sub-' + Date.now(),
                        examId: exam.id,
                        studentName: state.currentUser.name,
                        studentClass: state.currentUser.class,
                        submittedAt: null,
                        status: 'Pågår',
                        warnings: 0,
                        answers: {},
                        feedback: []
                    });
                    const exams = getExams();
                    const idx = exams.findIndex(e => e.id === exam.id);
                    if (idx !== -1) {
                        exams[idx] = exam;
                        saveExams(exams);
                    }
                }

                state.view = 'student_exam';
                setupCheatDetection();
                render();
            } else {
                error.classList.remove('hidden');
            }
        }

        // --- FLIKBYTESDETEKTERING ---
        function setupCheatDetection() {
            window.onvisibilitychange = () => {
                if (document.hidden && state.view === 'student_exam') {
                    triggerCheatWarning();
                }
            };
            window.onblur = () => {
                if (state.view === 'student_exam') {
                    triggerCheatWarning();
                }
            };
        }

        function triggerCheatWarning() {
            state.warningCount++;
            
            // Uppdatera status i lagringen
            const exams = getExams();
            const exam = exams.find(e => e.id === state.activeExam.id);
            if (exam) {
                const sub = exam.submissions.find(s => s.studentName.toLowerCase() === state.currentUser.name.toLowerCase());
                if (sub) {
                    sub.warnings = state.warningCount;
                    if (state.warningCount >= 2) {
                        sub.status = 'Låst (Rött kort)';
                    }
                    saveExams(exams);
                }
            }

            const modal = document.getElementById('cheatWarningModal');
            const title = document.getElementById('warningTitle');
            const msg = document.getElementById('warningMessage');

            if (state.warningCount === 1) {
                title.innerText = "Gult Kort: Du lämnade sidan!";
                msg.innerText = "Du har lämnat provfönstret 1 gång. Detta syns nu för läraren. Om du lämnar sidan igen låses ditt prov (Rött kort).";
                modal.classList.remove('hidden');
            } else if (state.warningCount >= 2) {
                title.innerText = "Rött Kort: Provet låst!";
                msg.innerText = "Du lämnade sidan igen. Ditt prov har låsts. Kontakta din lärare på skärmen för att bli upplåst.";
                modal.classList.remove('hidden');
            }
        }

        function closeWarningModal() {
            document.getElementById('cheatWarningModal').classList.add('hidden');
            if (state.warningCount >= 2) {
                state.view = 'welcome';
                render();
            }
        }

        // --- VY: PROVGENOMFÖRANDE (STUDENT_EXAM) ---
        function renderStudentExam(container) {
            const isEntryOrExit = state.activeExam.type === 'Entryticket' || state.activeExam.type === 'Exitticket';
            const displayTitle = isEntryOrExit ? 'Minns du?' : state.activeExam.title;

            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6">
                    <div class="bg-indigo-600 rounded-2xl p-6 text-white shadow-lg flex items-center justify-between">
                        <div>
                            <span class="text-xs uppercase tracking-wider font-semibold opacity-80">${state.activeExam.type} • ${state.activeExam.category}</span>
                            <h2 class="text-2xl font-bold">${displayTitle}</h2>
                            <p class="text-xs opacity-90 mt-1">Elev: ${state.currentUser.name} (${state.currentUser.class})</p>
                        </div>
                        <div class="bg-white/10 px-4 py-2 rounded-xl backdrop-blur-sm text-right">
                            <span class="text-xs block opacity-75">Status</span>
                            <span class="font-bold text-sm text-emerald-300">Aktivt prov</span>
                        </div>
                    </div>

                    <form onsubmit="handleExamSubmit(event)" class="space-y-6">
                        ${state.activeExam.questions.map((q, idx) => renderStudentQuestion(q, idx)).join('')}

                        <div class="bg-white rounded-2xl border border-slate-200 p-6 text-center shadow-sm">
                            <p class="text-xs text-slate-500 mb-4">Kontrollera dina svar noggrant innan du lämnar in.</p>
                            <button type="submit" class="w-full sm:w-auto px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95">
                                <i class="fa-solid fa-paper-plane mr-2"></i> Lämna in svar
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function renderStudentQuestion(q, idx) {
            if (q.type === 'concept') {
                return `
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                        <div class="flex items-center space-x-2 text-indigo-600 font-bold text-sm mb-2">
                            <span>Begrepp ${idx + 1}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-3">Förklara begreppet: <span class="text-indigo-600 font-extrabold">${q.concept}</span></h3>
                        <textarea required onchange="state.answers[${q.id}] = this.value" rows="3" placeholder="Skriv din förklaring här..."
                            class="w-full p-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm"></textarea>
                    </div>
                `;
            } else if (q.type === 'mc') {
                const multiChoiceNote = (q.correctOptions && q.correctOptions.length > 1) 
                    ? `<p class="text-xs font-semibold text-amber-600 mb-3"><i class="fa-solid fa-circle-info mr-1"></i> Obs! Denna fråga har ${q.correctOptions.length} korrekta svar.</p>` 
                    : '';

                return `
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                        <div class="text-indigo-600 font-bold text-sm mb-1">Fråga ${idx + 1}</div>
                        <h3 class="text-base font-bold text-slate-900 mb-2">${q.text}</h3>
                        ${multiChoiceNote}
                        <div class="space-y-2">
                            ${q.options.map((opt, oIdx) => `
                                <label class="flex items-center p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                                    <input type="${(q.correctOptions && q.correctOptions.length > 1) ? 'checkbox' : 'radio'}" name="q_${q.id}" value="${oIdx}" 
                                        onchange="saveMCAnswer(${q.id},${oIdx}, this)" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500">
                                    <span class="ml-3 text-sm text-slate-700">${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                        <div class="text-indigo-600 font-bold text-sm mb-1">Fråga ${idx + 1} (Öppen textfråga)</div>
                        <h3 class="text-base font-bold text-slate-900 mb-3">${q.text}</h3>
                        <textarea required onchange="state.answers[${q.id}] = this.value" rows="4" placeholder="Skriv ditt svar här..."
                            class="w-full p-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm"></textarea>
                    </div>
                `;
            }
        }

        function saveMCAnswer(qId, optionIdx, element) {
            if (element.type === 'checkbox') {
                if (!state.answers[qId]) state.answers[qId] = [];
                if (element.checked) {
                    if (!state.answers[qId].includes(optionIdx)) state.answers[qId].push(optionIdx);
                } else {
                    state.answers[qId] = state.answers[qId].filter(i => i !== optionIdx);
                }
            } else {
                state.answers[qId] = [optionIdx];
            }
        }

        function handleExamSubmit(e) {
            e.preventDefault();
            
            // Bedömning
            const exam = state.activeExam;
            const feedback = exam.questions.map(q => {
                let statusDot = 'lightgreen';
                let text = '';

                if (exam.type === 'Entryticket' || exam.type === 'Exitticket') {
                    // Ljusgrön eller Röd
                    const ans = (state.answers[q.id] || '').trim();
                    if (ans.length > 3) {
                        statusDot = 'lightgreen';
                        text = q.criteria ? `Rätt! Korrekt förklaring: ${q.criteria}` : 'Korrekt förstått begrepp!';
                    } else {
                        statusDot = 'red';
                        text = q.criteria ? `Behöver tränas mer. Korrekt förklaring var: ${q.criteria}` : 'Svaret var tyvärr för kort eller felaktigt.';
                    }
                } else if (exam.type === 'Träning') {
                    // Ingen färgbedömning (visas neutralt)
                    statusDot = 'none';
                    text = 'Bra jobbat! Tänk på att koppla samman dina argument ännu tydligare framöver.';
                } else {
                    // Test: Mörkgrön, Ljusgrön, Röd
                    const ans = state.answers[q.id];
                    if (q.type === 'mc') {
                        const correct = q.correctOptions || [q.correctOption];
                        const userAns = Array.isArray(ans) ? ans : [ans];
                        const isAllCorrect = correct.length === userAns.length && correct.every(val => userAns.includes(val));
                        if (isAllCorrect) {
                            statusDot = 'darkgreen';
                            text = 'Alla rätt! Utmärkt.';
                        } else {
                            statusDot = 'red';
                            text = 'Tyvärr fel svar på flervalsfrågan.';
                        }
                    } else {
                        const str = (ans || '').trim();
                        if (str.length > 50) {
                            statusDot = 'darkgreen';
                            text = 'Välutvecklat och strukturerat resonemang med goda kopplingar.';
                        } else if (str.length > 10) {
                            statusDot = 'lightgreen';
                            text = 'Godkänt och enkelt svar.';
                        } else {
                            statusDot = 'red';
                            text = 'Svaret saknar tillräckligt med djup. Behöver övas mer.';
                        }
                    }
                }

                return { questionId: q.id, statusDot, text };
            });

            const result = {
                id: 'sub-' + Date.now(),
                examId: exam.id,
                studentName: state.currentUser.name,
                studentClass: state.currentUser.class,
                submittedAt: new Date().toLocaleString('sv-SE'),
                status: 'Inlämnat',
                warnings: state.warningCount,
                answers: state.answers,
                feedback: feedback
            };

            // Spara i LocalStorage
            const exams = getExams();
            const examIdx = exams.findIndex(ex => ex.id === exam.id);
            if (examIdx !== -1) {
                if (!exams[examIdx].submissions) exams[examIdx].submissions = [];
                // Ersätt eller lägg till
                const subIdx = exams[examIdx].submissions.findIndex(s => s.studentName.toLowerCase() === state.currentUser.name.toLowerCase());
                if (subIdx !== -1) {
                    exams[examIdx].submissions[subIdx] = result;
                } else {
                    exams[examIdx].submissions.push(result);
                }
                saveExams(exams);
            }

            state.submittedResult = result;
            state.view = 'student_result';
            render();
        }

                    <div class="space-y-4 mb-8">

                        ${res.feedback.map((f, idx) => `

                    </button>
                </div>

        function renderDotBadge(statusDot) {
            if (statusDot === 'darkgreen') {
                return `<div class="w-7 h-7 rounded-full dot-darkgreen flex items-center justify-center font-bold text-xs shadow-sm flex-shrink-0" title="Välutvecklat (Mörkgrön)">★</div>`;

                return `<div class="w-7 h-7 rounded-full dot-lightgreen flex items-center justify-center font-bold text-xs shadow-sm flex-shrink-0" title="Godkänt/Rätt (Ljusgrön)">✓</div>`;

                        </button>
                    </div>
                </div>
            `;
        }

        function toggleCodeVisibility(id) {
            const el = document.getElementById(id);
            const code = el.getAttribute('data-code');
            if (el.innerText === '****') {
                el.innerText = code;
            } else {
                el.innerText = '****';
            }
        }

        function toggleExamActive(id) {
            const exams = getExams();
            const exam = exams.find(e => e.id === id);
            if (exam) {
                exam.active = !exam.active;
                saveExams(exams);
                render();
            }
        }

        function copyExam(id) {
            const exams = getExams();
            const exam = exams.find(e => e.id === id);
            if (exam) {
                const newExam = JSON.parse(JSON.stringify(exam));
                newExam.id = 'ex-' + Date.now();
                newExam.title = newExam.title + ' (Kopia)';
                newExam.code = Math.floor(1000 + Math.random() * 9000).toString();
                newExam.submissions = [];
                exams.push(newExam);
                saveExams(exams);
                render();
            }
        }

        function deleteExam(id) {
            const exams = getExams();
            const exam = exams.find(e => e.id === id);
            if (exam) {
                if (confirm(`Är du helt säker på att du vill radera uppgiften "${exam.title}"? Detta går inte att ångra.`)) {
                    const filtered = exams.filter(e => e.id !== id);
                    saveExams(filtered);
                    render();
                }
            }
        }

        function goToScreen(id) {
            state.selectedExamId = id;
            state.view = 'admin_screen';
            render();
        }

        function goToBoard(id) {
            state.selectedExamId = id;
            state.view = 'admin_board';
            render();
        }

        function renderScreenStudentCard(sub, examId) {

                cardBadge = `<span class="inline-block w-3.5 h-5 bg-amber-400 border border-amber-600 rounded-sm ml-2" title="Gult kort"></span>`;

                // Rött kort i fotboll
                cardBadge = `<span class="inline-block w-3.5 h-5 bg-red-600 border border-red-800 rounded-sm ml-2" title="Rött kort"></span>`;

            return `

            const exams = getExams();
            const exam = exams.find(e => e.id === examId);

                const sub = exam.submissions.find(s => s.studentName === studentName);
                if (sub) {
                    sub.status = 'Pågår';
                    sub.warnings = 0;
                    saveExams(exams);
                    render();
                }

            const exams = getExams();
            const exam = exams.find(e => e.id === examId);

        // --- VY: SKAPA / REDIGERA UPPGIFT (ADMIN_EDIT) ---
        function openCreateExamModal() {
            state.editingExam = {
                id: 'ex-' + Date.now(),
                title: '',
                type: 'Test',
                category: 'Historia',
                klass: '8B',
                code: Math.floor(1000 + Math.random() * 9000).toString(),
                active: true,
                questions: []
            };
            state.view = 'admin_edit';
            render();
        }

        function openEditExam(id) {
            const exams = getExams();
            const exam = exams.find(e => e.id === id);
            if (exam) {
                state.editingExam = JSON.parse(JSON.stringify(exam));
                state.view = 'admin_edit';
                render();
            }
        }

        function renderAdminEdit(container) {
            const exam = state.editingExam;
            const isEntryOrExit = exam.type === 'Entryticket' || exam.type === 'Exitticket';

            container.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-xl p-6 sm:p-8 space-y-6">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                        <h2 class="text-2xl font-bold text-slate-900">${exam.title ? 'Redigera uppgift' : 'Skapa Ny Uppgift'}</h2>
                        <button onclick="state.view='admin'; render();" class="text-sm font-semibold text-slate-500 hover:text-slate-800">Avbryt</button>
                    </div>

                    <form onsubmit="saveEditedExam(event)" class="space-y-5">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Typ av uppgift</label>
                                <select id="editType" onchange="changeExamType(this.value)" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 bg-white">
                                    <option value="Test" ${exam.type === 'Test' ? 'selected' : ''}>Test (🟢 🟢 🔴)</option>
                                    <option value="Entryticket" ${exam.type === 'Entryticket' ? 'selected' : ''}>Entryticket (🟢 🔴)</option>
                                    <option value="Exitticket" ${exam.type === 'Exitticket' ? 'selected' : ''}>Exitticket (🟢 🔴)</option>
                                    <option value="Träning" ${exam.type === 'Träning' ? 'selected' : ''}>Träning just nu</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ämne</label>
                                <select id="editCategory" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 bg-white">
                                    <option value="Historia" ${exam.category === 'Historia' ? 'selected' : ''}>Historia</option>
                                    <option value="Geografi" ${exam.category === 'Geografi' ? 'selected' : ''}>Geografi</option>
                                    <option value="Religion" ${exam.category === 'Religion' ? 'selected' : ''}>Religion</option>
                                    <option value="Samhällskunskap" ${exam.category === 'Samhällskunskap' ? 'selected' : ''}>Samhällskunskap</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Titel på uppgift</label>
                                <input type="text" id="editTitle" required value="${exam.title}" placeholder="t.ex. Industriella Revolutionen"
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Klass</label>
                                <input type="text" id="editKlass" required value="${exam.klass}" placeholder="8B"
                                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Provkod (4-siffrig)</label>
                            <input type="text" id="editCode" maxlength="4" required value="${exam.code}"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-mono tracking-widest focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <!-- FRÅGOR SEKTION -->
                        <div class="border-t border-slate-200 pt-5 space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="font-bold text-slate-900">${isEntryOrExit ? 'Begrepp som ska förklaras' : 'Frågor'}</h3>
                                <div class="space-x-2">
                                    ${isEntryOrExit ? `
                                        <button type="button" onclick="addConceptQuestion()" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 font-bold text-xs rounded-lg hover:bg-indigo-100">+ Lägg till begrepp</button>
                                    ` : `
                                        <button type="button" onclick="addTextQuestion()" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 font-bold text-xs rounded-lg hover:bg-indigo-100">+ Öppen textfråga</button>
                                        <button type="button" onclick="addMCQuestion()" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 font-bold text-xs rounded-lg hover:bg-indigo-100">+ Flervalsfråga</button>
                                    `}
                                </div>
                            </div>

                            <div class="space-y-4">
                                ${exam.questions.map((q, idx) => renderEditQuestionCard(q, idx, isEntryOrExit)).join('')}
                            </div>
                        </div>

                        <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition">
                            Spara Uppgift
                        </button>
                    </form>
                </div>
            `;
        }

        function changeExamType(newType) {
            state.editingExam.type = newType;
            if (newType === 'Entryticket' || newType === 'Exitticket') {
                state.editingExam.title = 'Minns du?';
            }
            render();
        }

        function renderEditQuestionCard(q, idx, isEntryOrExit) {
            if (isEntryOrExit) {
                return `
                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 relative space-y-3">
                        <button type="button" onclick="removeQuestion(${idx})" class="absolute top-3 right-3 text-red-500 hover:text-red-700 text-sm">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <span class="font-bold text-xs text-indigo-600">Begrepp ${idx + 1}</span>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Begrepp</label>
                            <input type="text" value="${q.concept || ''}" onchange="state.editingExam.questions[${idx}].concept = this.value" placeholder="t.ex. Jesus"
                                class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Förklaring (Facit)</label>
                            <input type="text" value="${q.criteria || ''}" onchange="state.editingExam.questions[${idx}].criteria = this.value" placeholder="Lämna tom för AI-hjälp"
                                class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                        </div>
                    </div>
                `;
            } else if (q.type === 'mc') {
                return `
                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 relative space-y-3">
                        <button type="button" onclick="removeQuestion(${idx})" class="absolute top-3 right-3 text-red-500 hover:text-red-700 text-sm">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <span class="font-bold text-xs text-indigo-600">Flervalsfråga ${idx + 1}</span>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Frågan</label>
                            <input type="text" value="${q.text || ''}" onchange="state.editingExam.questions[${idx}].text = this.value" placeholder="Skriv frågan här..."
                                class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Svarsalternativ (Bocka för alla korrekta svar)</label>
                            <div class="space-y-2">
                                ${q.options.map((opt, oIdx) => `
                                    <div class="flex items-center space-x-2">
                                        <input type="checkbox" ${q.correctOptions.includes(oIdx) ? 'checked' : ''} onchange="toggleMCCorrect(${idx},${oIdx})" class="w-4 h-4 text-indigo-600">
                                        <input type="text" value="${opt}" onchange="state.editingExam.questions[${idx}].options[${oIdx}] = this.value"
                                            class="flex-1 px-3 py-1.5 rounded-lg border border-slate-300 text-sm">
                                        <button type="button" onclick="removeMCOption(${idx},${oIdx})" class="text-red-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                            <button type="button" onclick="addMCOption(${idx})" class="mt-2 text-xs text-indigo-600 font-bold hover:underline">+ Lägg till svarsalternativ</button>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 relative space-y-3">
                        <button type="button" onclick="removeQuestion(${idx})" class="absolute top-3 right-3 text-red-500 hover:text-red-700 text-sm">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <span class="font-bold text-xs text-indigo-600">Öppen textfråga ${idx + 1}</span>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Frågan</label>
                            <input type="text" value="${q.text || ''}" onchange="state.editingExam.questions[${idx}].text = this.value" placeholder="Skriv frågan här..."
                                class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Förslag på svar och respons</label>
                            <textarea onchange="state.editingExam.questions[${idx}].criteria = this.value" rows="2" placeholder="Svarskriterier / förberedd respons..."
                                class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">${q.criteria || ''}</textarea>
                        </div>
                    </div>
                `;
            }
        }

        function addConceptQuestion() {
            state.editingExam.questions.push({ id: Date.now(), type: 'concept', concept: '', criteria: '' });
            render();
        }

        function addTextQuestion() {
            state.editingExam.questions.push({ id: Date.now(), type: 'text', text: '', criteria: '' });
            render();
        }

        function addMCQuestion() {
            state.editingExam.questions.push({
                id: Date.now(),
                type: 'mc',
                text: '',
                options: ['Rätt svar', 'Fel svar 1', 'Fel svar 2', 'Fel svar 3'],
                correctOptions: [0],
                criteria: ''
            });
            render();
        }

        function removeQuestion(idx) {
            state.editingExam.questions.splice(idx, 1);
            render();
        }

        function addMCOption(qIdx) {
            state.editingExam.questions[qIdx].options.push('Nytt alternativ');
            render();
        }

        function removeMCOption(qIdx, oIdx) {
            state.editingExam.questions[qIdx].options.splice(oIdx, 1);
            state.editingExam.questions[qIdx].correctOptions = state.editingExam.questions[qIdx].correctOptions.filter(i => i !== oIdx);
            render();
        }

        function toggleMCCorrect(qIdx, oIdx) {
            const arr = state.editingExam.questions[qIdx].correctOptions;
            if (arr.includes(oIdx)) {
                state.editingExam.questions[qIdx].correctOptions = arr.filter(i => i !== oIdx);
            } else {
                arr.push(oIdx);
            }
        }

        function saveEditedExam(e) {
            e.preventDefault();
            const exam = state.editingExam;
            exam.type = document.getElementById('editType').value;
            exam.category = document.getElementById('editCategory').value;
            exam.title = document.getElementById('editTitle').value.trim();
            exam.klass = document.getElementById('editKlass').value.trim();
            exam.code = document.getElementById('editCode').value.trim();

            const exams = getExams();
            const idx = exams.findIndex(ex => ex.id === exam.id);
            if (idx !== -1) {
                exams[idx] = exam;
            } else {
                exams.push(exam);
            }
            saveExams(exams);
            state.view = 'admin';
            render();
        }

        // Starta applikationen
        render();
    </script>
</body>
</html>
